# EVA-Dock: Dock 전용 도메인 + HTTPS. ex) https://dock.eva.com/
# Dock은 / 와 /api 를 사용하므로 App과 경로를 나눌 수 없습니다. App/IAM과 다른 도메인을 사용합니다.
dock:
  ingress:
    host: "<DOCK_HOST>"  # 필수: scheme, port, path 없는 Dock 도메인. DNS가 이 서버를 가리켜야 합니다. ex) dock.eva.com
    tls:
      enabled: true
      create: true
      hostPath: "<DOCK_TLS_CERT_DIRECTORY>"  # 필수: 대상 서버의 DOCK_HOST SAN 인증서 tls.crt + tls.key. ex) /etc/eva/dock-certs
  config:
    dockPublicUrl: "https://<DOCK_HOST>"  # 필수: 브라우저·EVA 웹훅이 접근할 Dock 외부 주소. ex) https://dock.eva.com
    dashboardEnabled: true  # DASHBOARD 메뉴
    liveEnabled: false  # LIVE 메뉴(탐지 알림 이력). 사용하려면 true
    streamingEnabled: false  # STREAMING 메뉴(카메라 실시간 MJPEG 영상). 사용하려면 true. EVA 서버당 동시 영상 수는 config.livePerEva(기본 16)
  secrets:
    dockAccessPassword: "<DOCK_ACCESS_PASSWORD>"  # 필수: Dock 로그인 비밀번호. ex) Demo-Dock-Only!42 (예시 전용). 업데이트 시에도 기존 값을 그대로 입력합니다.
