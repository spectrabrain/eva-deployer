- name: Resolve Vision ECR renewal paths
  ansible.builtin.set_fact:
    eva_vision_ecr_refresh_dir: "{{ eva_vision_ecr_refresh_dir | default('/opt/eva/vision-ecr/' ~ eva_vision_namespace ~ '/' ~ eva_vision_name) }}"
    eva_vision_ecr_refresh_unit: "eva-vision-ecr-{{ eva_vision_namespace }}-{{ eva_vision_name }}"
    eva_vision_ecr_systemd_dir: "{{ eva_vision_ecr_systemd_dir | default('/etc/systemd/system') }}"
    eva_vision_ecr_selected: >-
      {{ repository_mode in ['online_repository', 'cloud_repository']
         and (eva_vision_runtime_values.imagePullSecrets.enabled | bool)
         and not (eva_vision_runtime_values.imagePullSecrets.create | bool)
         and (eva_vision_runtime_values.imagePullSecrets.ExistingSecret | default('') | length > 0)
         and (eva_vision_runtime_values.image.repository is match('^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com(?:\.cn)?/')) }}

- name: Check existing Vision ECR renewal timer
  ansible.builtin.stat:
    path: "{{ eva_vision_ecr_systemd_dir }}/{{ eva_vision_ecr_refresh_unit }}.timer"
  register: eva_vision_ecr_existing_timer

# Stop previous renewal before a repository mode or selected Secret changes.
- name: Stop previous Vision ECR renewal timer during installation
  ansible.builtin.systemd_service:
    name: "{{ eva_vision_ecr_refresh_unit }}.timer"
    enabled: false
    state: stopped
  when:
    - eva_vision_ecr_existing_timer.stat.exists
    - not (eva_vision_ecr_selected | bool)

- name: Stop any previous Vision ECR renewal invocation during installation
  ansible.builtin.systemd_service:
    name: "{{ eva_vision_ecr_refresh_unit }}.service"
    state: stopped
  when:
    - eva_vision_ecr_existing_timer.stat.exists
    - not (eva_vision_ecr_selected | bool)

- name: Prepare selected Online EVA Vision ECR authentication
  when: eva_vision_ecr_selected | bool
  block:
    - name: Resolve target AWS credential user for Vision ECR
      ansible.builtin.set_fact:
        eva_vision_ecr_user: "{{ ansible_user | default(ansible_user_id) }}"

    - name: Look up target AWS credential home for Vision ECR
      ansible.builtin.getent:
        database: passwd
        key: "{{ eva_vision_ecr_user }}"

    - name: Resolve persistent Vision ECR helper environment
      ansible.builtin.set_fact:
        eva_vision_ecr_environment:
          HOME: "{{ getent_passwd[eva_vision_ecr_user][4] }}"
          AWS_SHARED_CREDENTIALS_FILE: "{{ getent_passwd[eva_vision_ecr_user][4] }}/.aws/credentials"
          AWS_CONFIG_FILE: "{{ getent_passwd[eva_vision_ecr_user][4] }}/.aws/config"
          AWS_PROFILE: "{{ eva_vision_ecr_aws_profile | default('default') }}"
          KUBECONFIG: "{{ eva_vision_kubeconfig }}"

    - name: Ensure persistent Vision ECR helper directory exists
      ansible.builtin.file:
        path: "{{ eva_vision_ecr_refresh_dir }}"
        state: directory
        mode: "0700"

    - name: Copy Vision ECR authentication helper to target
      ansible.builtin.copy:
        src: ecr_pull_secret.py
        dest: "{{ eva_vision_ecr_refresh_dir }}/ecr_pull_secret.py"
        mode: "0700"

    - name: Create or renew EVA Vision ECR image pull Secret before deployment
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ eva_vision_ecr_refresh_dir }}/ecr_pull_secret.py"
          - --namespace
          - "{{ eva_vision_namespace }}"
          - --secret
          - "{{ eva_vision_runtime_values.imagePullSecrets.ExistingSecret }}"
          - --repository
          - "{{ eva_vision_runtime_values.image.repository }}"
      environment: "{{ eva_vision_ecr_environment }}"
      register: eva_vision_ecr_auth_result
      changed_when: eva_vision_ecr_auth_result.rc == 0 and (eva_vision_ecr_auth_result.stdout | from_json).changed

    # Keep an existing renewal schedule intact if initial authentication fails.
    - name: Stop previous Vision ECR timer after successful authentication
      ansible.builtin.systemd_service:
        name: "{{ eva_vision_ecr_refresh_unit }}.timer"
        enabled: false
        state: stopped
      when: eva_vision_ecr_existing_timer.stat.exists

    - name: Stop previous Vision ECR service before updating renewal configuration
      ansible.builtin.systemd_service:
        name: "{{ eva_vision_ecr_refresh_unit }}.service"
        state: stopped
      when: eva_vision_ecr_existing_timer.stat.exists

    - name: Install periodic renewal for Deployer-managed Vision ECR authentication
      when: (eva_vision_ecr_auth_result.stdout | from_json).managed | bool
      block:
        - name: Write Vision ECR token renewal service
          ansible.builtin.template:
            src: ecr-refresh.service.j2
            dest: "{{ eva_vision_ecr_systemd_dir }}/{{ eva_vision_ecr_refresh_unit }}.service"
            mode: "0644"

        - name: Write Vision ECR token renewal timer
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=Renew EVA Vision ECR credentials before their 12-hour expiry

              [Timer]
              OnBootSec=5min
              OnUnitActiveSec=6h

              [Install]
              WantedBy=timers.target
            dest: "{{ eva_vision_ecr_systemd_dir }}/{{ eva_vision_ecr_refresh_unit }}.timer"
            mode: "0644"

        - name: Enable and start Vision ECR token renewal timer
          ansible.builtin.systemd_service:
            name: "{{ eva_vision_ecr_refresh_unit }}.timer"
            daemon_reload: true
            enabled: true
            state: started
