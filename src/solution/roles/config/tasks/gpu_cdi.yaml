- name: Check nvidia-ctk binary exists
  ansible.builtin.stat:
    path: "{{ config_gpu_cdi_nvidia_ctk_path | default('/usr/bin/nvidia-ctk') }}"
  register: config_gpu_cdi_nvidia_ctk

- name: Fail when nvidia-ctk is missing
  ansible.builtin.fail:
    msg: >-
      nvidia-ctk not found at {{ config_gpu_cdi_nvidia_ctk_path | default('/usr/bin/nvidia-ctk') }}.
      Install NVIDIA Container Toolkit first.
  when:
    - not config_gpu_cdi_nvidia_ctk.stat.exists

- name: Ensure CDI directory exists
  ansible.builtin.file:
    path: /etc/cdi
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Force NVIDIA container runtime mode to cdi
  ansible.builtin.lineinfile:
    path: "{{ config_gpu_cdi_runtime_config_path | default('/etc/nvidia-container-runtime/config.toml') }}"
    regexp: '^\s*#?\s*mode\s*='
    line: 'mode = "cdi"'
    insertafter: '^\[nvidia-container-runtime\]'

- name: Install read-only MIG readiness check for CDI
  ansible.builtin.copy:
    src: "{{ role_path | default((ansible_search_path | first) | dirname) }}/files/verify-mig-before-cdi.sh"
    dest: /usr/local/sbin/verify-mig-before-cdi.sh
    owner: root
    group: root
    mode: "0755"

- name: Verify configured MIG devices before generating CDI
  ansible.builtin.command: /usr/local/sbin/verify-mig-before-cdi.sh
  changed_when: false
  when: not ansible_check_mode

- name: Generate NVIDIA CDI spec
  ansible.builtin.command: >-
    {{ config_gpu_cdi_nvidia_ctk_path | default('/usr/bin/nvidia-ctk') }}
    cdi generate --output=/etc/cdi/nvidia.yaml
  register: config_gpu_cdi_generate
  changed_when: true

- name: Install NVIDIA CDI refresh systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/nvidia-cdi-refresh.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Regenerate NVIDIA CDI spec
      Wants=nvidia-persistenced.service
      # Order boot jobs without starting or reconfiguring MIG during a CDI refresh.
      After=nvidia-persistenced.service gpu-mig-auto-enable.service
      Before=k3s.service

      [Service]
      Type=oneshot
      ExecStartPre=/usr/local/sbin/verify-mig-before-cdi.sh
      ExecStart={{ config_gpu_cdi_nvidia_ctk_path | default('/usr/bin/nvidia-ctk') }} cdi generate --output=/etc/cdi/nvidia.yaml

      [Install]
      WantedBy=multi-user.target

- name: Ensure k3s drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Require a successful CDI refresh before k3s starts
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/10-nvidia-cdi.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Wants=nvidia-cdi-refresh.service
      After=nvidia-cdi-refresh.service

      [Service]
      ExecStartPre=/bin/sh -c 'systemctl show -p LoadState --value nvidia-cdi-refresh.service | grep -qx loaded && systemctl show -p Result --value nvidia-cdi-refresh.service | grep -qx success'

- name: Reload systemd daemon for CDI service
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable NVIDIA CDI refresh service
  ansible.builtin.systemd:
    name: nvidia-cdi-refresh.service
    enabled: true
  when: not ansible_check_mode

- name: Mark GPU CDI policy status
  ansible.builtin.set_fact:
    config_gpu_cdi_status: "enabled"
  changed_when: false
