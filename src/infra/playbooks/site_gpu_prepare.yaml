- name: Check and prepare EVA GPU layout
  hosts: all
  become: true
  any_errors_fatal: true
  serial: 1
  vars_files:
    - ../../playbook-vars.yaml
  pre_tasks:
    - name: Load shared EVA playbook context
      ansible.builtin.import_tasks: ../../playbook-preflight.yaml
    - name: Resolve GPU preparation repository mode
      ansible.builtin.set_fact:
        repository_mode: "{{ repository_mode | default('online_repository') }}"
        airgap_mode: "{{ (repository_mode | default('online_repository')) in ['remote_repository', 'local_repository'] }}"
  roles:
    - gpu_prepare
