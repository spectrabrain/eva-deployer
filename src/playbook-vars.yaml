---
eva_repo_root: "{{ playbook_dir | dirname | dirname | dirname }}"
eva_src_root: "{{ eva_repo_root ~ '/src' }}"
eva_infra_root: "{{ eva_src_root ~ '/infra' }}"
eva_solution_root: "{{ eva_src_root ~ '/solution' }}"
eva_playbook_family_root: "{{ playbook_dir | dirname }}"
eva_default_workspace_root: "{{ eva_repo_root ~ '/workspace' }}"
eva_versions_file: "{{ eva_playbook_family_root ~ '/version.yaml' }}"
eva_template_values_root: "{{ eva_solution_root ~ '/values' }}"
eva_generated_config_root: "{{ eva_repo_root ~ '/out/work/config' }}"
eva_deploy_root: "{{ eva_repo_root ~ '/out/work/rendered' }}"
eva_cache_root: "{{ eva_repo_root ~ '/out/cache' }}"
eva_workspace_root: >-
  {{
    lookup('ansible.builtin.env', 'EVA_WORKSPACE_ROOT')
    | default(eva_default_workspace_root, true)
    | regex_replace('/+$', '')
  }}
eva_site_values_root: "{{ (eva_workspace_root | regex_replace('/+$', '')) ~ '/site-values' }}"