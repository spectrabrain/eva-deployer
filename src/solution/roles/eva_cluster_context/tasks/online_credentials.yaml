---
# Reuse the Agent role's validate-before-mutation and scoped Job cleanup helper.
# The selected Secret is never read from the Bastion's default AWS profile.
- name: Resolve the selected product's Online credential contract
  no_log: true
  ansible.builtin.set_fact:
    eva_online_release: "eva-{{ eva_online_component }}"
    eva_online_values: "{{ eva_online_input_values | default(eva_cluster_values[eva_online_component]) }}"
    eva_online_helper_root: "{{ ansible_facts.env.HOME }}/.local/state/eva/online-credentials/{{ eva_online_component }}"
    eva_online_version: "{{ lookup('vars', 'eva_' ~ eva_online_component ~ '_chart_version') }}"

- name: Resolve the Release product repository family
  no_log: true
  ansible.builtin.set_fact:
    eva_online_default_repository: >-
      {{ ('211722900905.dkr.ecr.ap-northeast-2.amazonaws.com/spectrabrain/'
          if eva_online_version is version('3.3.0', '>=')
          else '339713051385.dkr.ecr.ap-northeast-2.amazonaws.com/mellerikat/release/')
         ~ 'eva-' ~ eva_online_component }}

- name: Resolve registry images and Secret name
  no_log: true
  ansible.builtin.set_fact:
    eva_online_secret: >-
      {{ eva_online_values.awsCredentialsSecretName | default('aws-credentials')
         if eva_online_component == 'agent'
         else ((eva_online_values.imagePullSecrets | default({})).secretName | default('aws-credentials')) }}
    eva_online_repositories: >-
      {{ [(eva_online_values.keycloak | default({})).get('image', {}).get('repository', eva_online_default_repository ~ '/keycloak'),
          (eva_online_values.dispatcher | default({})).get('image', {}).get('repository', eva_online_default_repository ~ '/dispatcher')]
         if eva_online_component == 'iam'
         else [(eva_online_values.image | default({})).repository | default(
           eva_online_default_repository)] }}
    eva_online_cronjob: >-
      {{ 'eva-agent-ecr-refresh' if eva_online_component == 'agent'
         else ('eva-vision-ecr-refresh' if eva_online_component == 'vision'
               else 'eva-' ~ eva_online_component ~ '-ecr-cronjob') }}

- name: Require App and IAM ECR renewal to match the selected image registry
  ansible.builtin.assert:
    that:
      - (eva_online_values.imagePullSecrets | default({})).account | default(eva_online_repositories[0].split('.')[0]) | string == eva_online_repositories[0].split('.')[0]
      - (eva_online_values.imagePullSecrets | default({})).region | default(eva_online_repositories[0].split('.')[3]) == eva_online_repositories[0].split('.')[3]
      - eva_online_repositories | map('regex_replace', '/.*$', '') | unique | length == 1
    fail_msg: "App/IAM imagePullSecrets.account and region must match the selected ECR image repository. Fill the new Release registry settings before installation."
  when:
    - eva_online_component in ['app', 'iam']
    - eva_online_repositories[0] is match('^[0-9]{12}\.dkr\.ecr\.')
    - (eva_online_values.imagePullSecrets | default({})).enabled | default(true) | bool
    - (eva_online_values.imagePullSecrets | default({})).create | default(true) | bool

- name: Require Agent ECR renewal to match the selected image registry
  ansible.builtin.assert:
    that:
      - (eva_online_values.ecrRefresh | default({})).registry | default(eva_online_repositories[0].split('/')[0]) == eva_online_repositories[0].split('/')[0]
      - (eva_online_values.ecrRefresh | default({})).region | default(eva_online_repositories[0].split('.')[3]) == eva_online_repositories[0].split('.')[3]
    fail_msg: "Agent ecrRefresh.registry and region must match the selected ECR image repository. Fill the new Release registry settings before installation."
  when:
    - eva_online_component == 'agent'
    - eva_online_repositories[0] is match('^[0-9]{12}\.dkr\.ecr\.')
    - (eva_online_values.ecrRefresh | default({})).enabled | default(true) | bool

- name: Read selected Workspace AWS credentials privately when supplied
  ansible.builtin.set_fact:
    eva_online_aws_input: "{{ lookup('ansible.builtin.file', eva_workspace_credentials_root ~ '/aws_key.ini', errors='ignore') | default('', true) }}"
  no_log: true

- name: Resolve the selected image tags without overriding product Values
  no_log: true
  ansible.builtin.set_fact:
    eva_online_image_tags: >-
      {{ {eva_online_repositories[0]: (eva_online_values.keycloak | default({})).get('image', {}).get('tag', eva_online_version) | string,
          eva_online_repositories[1]: (eva_online_values.dispatcher | default({})).get('image', {}).get('tag', eva_online_version) | string}
         if eva_online_component == 'iam'
         else {eva_online_repositories[0]: (eva_online_values.image | default({})).tag | default(eva_online_version, true) | string} }}

- name: Ensure shared Online helper directory exists
  ansible.builtin.file:
    path: "{{ eva_online_helper_root }}"
    state: directory
    mode: "0700"

- name: Copy the existing shared credential synchronization helper
  ansible.builtin.copy:
    src: "{{ eva_solution_root }}/roles/eva_agent/files/manage_online_credentials.py"
    dest: "{{ eva_online_helper_root }}/manage_online_credentials.py"
    mode: "0700"

- name: Validate or synchronize the selected product's Online credentials
  no_log: true
  block:
    - name: Check both IAM images against effective Values before synchronizing credentials
      ansible.builtin.command:
        argv: >-
          {{ ['python3', eva_online_helper_root ~ '/manage_online_credentials.py', 'check',
              '--namespace', eva_online_release, '--release', eva_online_release,
              '--secret', eva_online_secret, '--reuse-existing',
              '--managed-annotation', 'eva.spectrabrain.com/online-aws-credentials',
              '--repository', item, '--image-tag', eva_online_image_tags[item]] }}
        stdin: "{{ eva_online_aws_input }}"
      environment:
        KUBECONFIG: "{{ eva_cluster_kubeconfig }}"
      loop: "{{ eva_online_repositories | select('match', '^[0-9]{12}\\.dkr\\.ecr\\.') | list }}"
      when: eva_online_component == 'iam' and eva_online_action == 'prepare'
      changed_when: false

    - name: Create product namespace only after the read-only precondition passed
      ansible.builtin.shell: >-
        set -o pipefail;
        kubectl create namespace {{ eva_online_release | quote }} --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ eva_cluster_kubeconfig }}"
      when: eva_online_action == 'prepare'
      changed_when: false

    - name: Use the exact credential Secret for token and repository validation
      ansible.builtin.command:
        argv: >-
          {{ ['python3', eva_online_helper_root ~ '/manage_online_credentials.py', eva_online_action,
              '--namespace', eva_online_release, '--release', eva_online_release,
              '--cronjob', eva_online_cronjob, '--hook', eva_online_release ~ ('-ecr-job-once' if eva_online_component in ['app', 'iam'] else '-ecr-refresh-hook'),
              '--managed-annotation', 'eva.spectrabrain.com/online-aws-credentials',
              '--secret', eva_online_secret, '--reuse-existing',
              '--repository', item, '--image-tag', eva_online_image_tags[item]] }}
        stdin: "{{ eva_online_aws_input }}"
      environment:
        KUBECONFIG: "{{ eva_cluster_kubeconfig }}"
      loop: >-
        {{ (eva_online_repositories | select('match', '^[0-9]{12}\.dkr\.ecr\.') | list)[:1]
           if eva_online_action == 'prepare'
           else (eva_online_repositories | select('match', '^[0-9]{12}\.dkr\.ecr\.') | list) }}
      register: eva_online_auth_result
      changed_when: eva_online_action == 'prepare' and (eva_online_auth_result.stdout | from_json).changed

    - name: Save schedules paused by this product installation
      ansible.builtin.set_fact:
        eva_online_suspended: >-
          {{ eva_online_auth_result.results | map(attribute='stdout') | map('from_json')
             | map(attribute='suspended', default=[]) | flatten }}
      when: eva_online_action == 'prepare'

    - name: Prepare App and IAM pull Secrets before waiting for their ECR Jobs
      when:
        - eva_online_action == 'prepare'
        - eva_online_component in ['app', 'iam']
        - (eva_online_values.imagePullSecrets | default({})).enabled | default(true) | bool
        - eva_online_repositories | select('match', '^[0-9]{12}\.dkr\.ecr\.') | list | length > 0
      block:
        - name: Resolve the exact chart pull Secret reference
          ansible.builtin.set_fact:
            eva_online_pull_secret: >-
              {{ (eva_online_values.imagePullSecrets | default({})).ExistingSecret | default('', true)
                 or ((eva_online_values.imagePullSecrets | default({})).nameOverride | default('', true))
                 or (eva_online_release ~ '-secret-regcred') }}

        - name: Copy the shared namespace ECR pull Secret helper
          ansible.builtin.copy:
            src: "{{ eva_solution_root }}/roles/eva_vision/files/ecr_pull_secret.py"
            dest: "{{ eva_online_helper_root }}/ecr_pull_secret.py"
            mode: "0700"

        - name: Refresh the chart-selected registry Secret using verified AWS credentials
          ansible.builtin.command:
            argv: [python3, "{{ eva_online_helper_root }}/ecr_pull_secret.py",
                   --namespace, "{{ eva_online_release }}", --secret, "{{ eva_online_pull_secret }}",
                   --repository, "{{ eva_online_repositories[0] }}", --credentials-secret, "{{ eva_online_secret }}",
                   --managed-default, "{{ eva_online_pull_secret if ((eva_online_values.imagePullSecrets | default({})).create | default(true) | bool) else 'ecr-registry' }}"]
          environment:
            KUBECONFIG: "{{ eva_cluster_kubeconfig }}"
          register: eva_online_pull_result
          changed_when: (eva_online_pull_result.stdout | from_json).changed
  rescue:
    - name: Report credential failure without revealing keys or tokens
      no_log: false
      ansible.builtin.fail:
        msg: >-
          {{ eva_online_release }} ECR credential validation failed. Check the selected
          aws-credentials Secret or credentials.aws, key activation, repository pull permissions
          and Release image existence. Workloads have not been stopped.
  always:
    - name: Clear transient AWS credential input
      ansible.builtin.set_fact:
        eva_online_aws_input: ''
      no_log: true
