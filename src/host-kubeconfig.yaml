---
- name: Inspect the existing server k3s kubeconfig
  ansible.builtin.stat:
    path: "{{ eva_k3s_kubeconfig_source | default('/etc/rancher/k3s/k3s.yaml') }}"
  register: eva_server_k3s_config

- name: Inspect the installation account default kubeconfig
  ansible.builtin.stat:
    path: "{{ eva_kubeconfig_home | default(ansible_facts.env.HOME) }}/.kube/config"
  register: eva_server_account_config

- name: Prepare missing account kubeconfig from the existing k3s server
  when:
    - eva_server_k3s_config.stat.isreg | default(false)
    - not (eva_server_account_config.stat.exists | bool)
    - ansible_facts.env.KUBECONFIG | default('') | length == 0
  block:
    - name: Create private installation account kubeconfig directory
      ansible.builtin.file:
        path: "{{ eva_kubeconfig_home | default(ansible_facts.env.HOME) }}/.kube"
        state: directory
        mode: '0700'

    - name: Copy the existing k3s connection without overwriting account configuration
      no_log: true
      ansible.builtin.copy:
        src: "{{ eva_k3s_kubeconfig_source | default('/etc/rancher/k3s/k3s.yaml') }}"
        dest: "{{ eva_kubeconfig_home | default(ansible_facts.env.HOME) }}/.kube/config"
        remote_src: true
        force: false
        mode: '0600'

    - name: Use the prepared connection for Argo CD preconditions
      ansible.builtin.set_fact:
        precondition_argocd_kubeconfig_override: >-
          {{ precondition_argocd_kubeconfig_override
             | default((eva_kubeconfig_home | default(ansible_facts.env.HOME)) ~ '/.kube/config') }}
