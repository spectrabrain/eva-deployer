# v3.3 대상 로컬 App/IAM 소스 기준. Release 버전 전환 및 Deployer HTTP 실행 연동은 별도입니다.
# 동일 도메인/IP + HTTP: App /, IAM /iam. ex) http://192.0.2.10/, http://192.0.2.10/iam
# 같은 placeholder는 모두 같은 값으로 교체합니다. HTTP는 암호화되지 않으므로 격리된 검증 환경에만 사용합니다.
iam:
  config:
    host: "<PUBLIC_HOST>" # 필수: scheme, port, path 없는 공통 도메인 또는 IP. ex) 192.0.2.10
  keycloak:
    realmPatch:
      realmAdmin:
        password: "<REALM_ADMIN_PASSWORD>" # 필수: IAM realm 관리자 비밀번호. ex) Demo-Realm-Only!42 (예시 전용)
      evaApp:
        redirectUris:
          - "http://<PUBLIC_HOST>/*" # 필수: App 외부 주소. ex) http://192.0.2.10/*
  ingress:
    path: /iam # App / 와 분리, SSO handoff가 /iam을 자동 반영합니다.
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    tls:
      enabled: false # Ingress TLS 및 TLS Secret Job을 사용하지 않습니다.
      create: false
  redis:
    tls:
      enabled: false # HTTP 구성에 맞춰 Redis TLS도 끕니다.
    external:
      enabled: true # 고정 기본 틀: Redis 외부 접속을 사용합니다.
app:
  ingress:
    path: /
    tls:
      enabled: false
      create: false
  app:
    backendHost: "<PUBLIC_HOST>" # 필수: IAM config.host와 동일. ex) 192.0.2.10
    backendSecure: false
    backendPublicPort: 80 # HTTP 외부 포트. 비표준 포트 사용 시 IAM publicPort/redirectUris에도 동일하게 반영합니다.
    browserTitleName: EVA
    # SSO baseUrl/adminClientSecret은 함께 설치하는 IAM에서 자동 전달됩니다.
    license:
      activation_mode: online
      product_code: "<LICENSE_PRODUCT_CODE>" # 필수: 승인된 license 제품 코드. ex) eva
      api_key: "<LICENSE_API_KEY>" # 필수: 발급된 license API key. ex) demo-license-api-key (예시 전용)
      shared_key: "<LICENSE_SHARED_KEY>" # 필수: 발급된 license shared key. ex) demo-license-shared-key (예시 전용)
