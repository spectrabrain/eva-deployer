- name: Install k3s
  ansible.builtin.import_tasks: install.yaml

- name: Configure kubeconfig
  ansible.builtin.import_tasks: kubeconfig.yaml

- name: Configure k3s nvidia runtime
  ansible.builtin.import_tasks: nvidia-runtime.yaml
  when:
    - gpu_has_nvidia | default(false) | bool

- name: Install nvidia device plugin
  ansible.builtin.import_tasks: nvidia-device-plugin.yaml
  when:
    - gpu_has_nvidia | default(false) | bool
