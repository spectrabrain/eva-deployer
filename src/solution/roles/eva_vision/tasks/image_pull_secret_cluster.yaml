---
- name: Read previously managed Vision ECR renewal
  ansible.builtin.command:
    argv: [kubectl, -n, "{{ eva_vision_namespace }}", get, cronjob, eva-vision-ecr-refresh,
           --ignore-not-found=true, -o, json]
  environment:
    KUBECONFIG: "{{ eva_cluster_kubeconfig }}"
  register: eva_vision_previous_renewal
  changed_when: false

- name: Resolve whether cluster Vision ECR renewal is selected
  ansible.builtin.set_fact:
    eva_vision_cluster_renewal_selected: >-
      {{ (eva_vision_runtime_values.image.repository is match('^[0-9]{12}\.dkr\.ecr\.'))
         and (eva_vision_runtime_values.imagePullSecrets.enabled | bool)
         and not (eva_vision_runtime_values.imagePullSecrets.create | bool) }}

- name: Stop previous Vision ECR renewal when its credential source is no longer selected
  ansible.builtin.include_tasks: stop_cluster_renewal.yaml
  when:
    - not (eva_vision_cluster_renewal_selected | bool)
    - eva_vision_previous_renewal.stdout | trim | length > 0

- name: Prepare Vision Online credentials through the shared synchronization helper
  ansible.builtin.include_tasks: "{{ eva_solution_root }}/roles/eva_cluster_context/tasks/online_credentials.yaml"
  vars:
    eva_online_component: vision
    eva_online_action: prepare
  when:
    - eva_vision_runtime_values.image.repository is match('^[0-9]{12}\.dkr\.ecr\.')
    - eva_vision_runtime_values.imagePullSecrets.enabled | bool

- name: Prepare Vision pull Secret and Kubernetes renewal
  when:
    - eva_vision_runtime_values.image.repository is match('^[0-9]{12}\.dkr\.ecr\.')
    - eva_vision_runtime_values.imagePullSecrets.enabled | bool
    - not (eva_vision_runtime_values.imagePullSecrets.create | bool)
  block:
    - name: Copy the existing Vision ECR pull Secret helper
      ansible.builtin.copy:
        src: ecr_pull_secret.py
        dest: "{{ eva_online_helper_root }}/ecr_pull_secret.py"
        mode: "0700"

    - name: Renew Vision pull Secret using the selected namespace AWS Secret
      ansible.builtin.command:
        argv: [python3, "{{ eva_online_helper_root }}/ecr_pull_secret.py",
               --namespace, "{{ eva_vision_namespace }}",
               --secret, "{{ eva_vision_runtime_values.imagePullSecrets.ExistingSecret }}",
               --repository, "{{ eva_vision_runtime_values.image.repository }}",
               --credentials-secret, "{{ eva_online_secret }}"]
      environment:
        KUBECONFIG: "{{ eva_cluster_kubeconfig }}"
      register: eva_vision_cluster_ecr
      changed_when: (eva_vision_cluster_ecr.stdout | from_json).changed

    - name: Stop Deployer renewal when a custom operator pull Secret is selected
      ansible.builtin.include_tasks: stop_cluster_renewal.yaml
      when:
        - not ((eva_vision_cluster_ecr.stdout | from_json).managed | bool)
        - eva_vision_previous_renewal.stdout | trim | length > 0

    - name: Render Vision ECR renewal resources
      ansible.builtin.template:
        src: ecr-refresh-cluster.yaml.j2
        dest: "{{ eva_online_helper_root }}/renewal.yaml"
        mode: "0600"
      when: (eva_vision_cluster_ecr.stdout | from_json).managed

    - name: Enable namespace-scoped Vision ECR renewal without worker systemd
      ansible.builtin.command:
        argv: [kubectl, apply, -f, "{{ eva_online_helper_root }}/renewal.yaml"]
      environment:
        KUBECONFIG: "{{ eva_cluster_kubeconfig }}"
      when: (eva_vision_cluster_ecr.stdout | from_json).managed
      register: eva_vision_cluster_renewal
      changed_when: "'created' in eva_vision_cluster_renewal.stdout or 'configured' in eva_vision_cluster_renewal.stdout"
