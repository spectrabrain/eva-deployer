[defaults]
roles_path = ./src/infra/roles:./src/solution/roles
host_key_checking = True

[ssh_connection]
# Register first-seen target keys without a separate interactive SSH session.
# OpenSSH still rejects changed keys before sending authentication credentials.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new