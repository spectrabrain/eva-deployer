---
- name: Set n8n defaults
  ansible.builtin.set_fact:
    repository_mode: "{{ repository_mode | default('cloud_repository') }}"
    repository_project: "{{ repository_project | default('eva') }}"
    repository_registry: >-
      {{
        repository_registry
        | default(harbor_registry | default(((repository_mode | default('cloud_repository')) == 'local_repository') | ternary('localhost:32080', '')))
        | regex_replace('^https?://', '')
        | regex_replace('/+$', '')
      }}
    airgap_mode: "{{ (airgap_mode | default(false) | bool) or ((repository_mode | default('cloud_repository')) in ['remote_repository', 'local_repository']) }}"
    n8n_enabled: "{{ n8n_enabled | default(true) | bool }}"
    n8n_pinned_image: "{{ n8n_pinned_image | default(deploy_versions.n8n_image) }}"
    n8n_image_tag: "{{ n8n_image_tag | default((n8n_pinned_image | default(deploy_versions.n8n_image)) | regex_replace('^.*:', '')) }}"
    n8n_namespace: "{{ n8n_namespace | default('n8n') }}"
    n8n_app_name: "{{ n8n_app_name | default('n8n') }}"
    n8n_replicas: "{{ n8n_replicas | default(1) | int }}"
    n8n_service_type: "{{ n8n_service_type | default('NodePort') }}"
    n8n_service_port: "{{ n8n_service_port | default(5678) | int }}"
    n8n_node_port: "{{ n8n_node_port | default(30678) | int }}"
    n8n_storage_size: "{{ n8n_storage_size | default('20Gi') }}"
    n8n_storage_class_name: "{{ n8n_storage_class_name | default('local-path') }}"
    n8n_timezone: "{{ n8n_timezone | default('Asia/Seoul') }}"
    n8n_protocol: "{{ n8n_protocol | default('http') }}"
    n8n_public_host: "{{ n8n_public_host | default(ansible_host | default(inventory_hostname)) }}"
    n8n_api_host: "{{ n8n_api_host | default(n8n_public_host | default(ansible_host | default(inventory_hostname))) }}"
    n8n_webhook_path: "{{ n8n_webhook_path | default('/webhook/n8n/eva-alert') }}"
    n8n_workflow_webhook_node_path: "{{ (n8n_webhook_path | default('/webhook/n8n/eva-alert')) | regex_replace('^/webhook/', '') | regex_replace('^/', '') }}"
    n8n_workflow_name: "{{ n8n_workflow_name | default('EVA Alert Workflow') }}"
    n8n_owner_email: "{{ n8n_owner_email | default('eva@spectrabrain.ai') }}"
    n8n_owner_first_name: "{{ n8n_owner_first_name | default('eva') }}"
    n8n_owner_last_name: "{{ n8n_owner_last_name | default('spectrabrain') }}"
    n8n_owner_password_plain: "{{ n8n_owner_password_plain | default('EVA!234qwer') }}"
    n8n_config_output_dir: "{{ playbook_dir }}/config/{{ ansible_host | default(inventory_hostname) }}"
  no_log: true

- name: Validate n8n owner password policy
  ansible.builtin.assert:
    that:
      - n8n_owner_password_plain | length >= 8
      - n8n_owner_password_plain | length <= 64
      - n8n_owner_password_plain | regex_search('[0-9]') is not none
      - n8n_owner_password_plain | regex_search('[A-Z]') is not none
    fail_msg: >-
      n8n_owner_password_plain은 8~64자이며 숫자와 대문자를 각각 하나 이상 포함해야 합니다.
  when: n8n_enabled

- name: Validate repository mode for n8n
  ansible.builtin.assert:
    that:
      - repository_mode in ['cloud_repository', 'remote_repository', 'local_repository']
      - repository_mode == 'cloud_repository' or repository_registry | length > 0
    fail_msg: >-
      repository_mode은 cloud_repository, remote_repository, local_repository 중 하나여야 합니다.
      remote_repository/local_repository 모드에서는 repository_registry 또는 harbor_registry가 필요합니다.

- name: Resolve n8n image repository
  ansible.builtin.set_fact:
    n8n_deployment_image: >-
      {{
        n8n_image | default(
          (repository_mode == 'cloud_repository')
          | ternary(n8n_pinned_image, repository_registry ~ '/' ~ repository_project ~ '/n8n:' ~ n8n_image_tag)
        )
      }}

- name: Check k3s API accessibility for n8n deployment
  ansible.builtin.command:
    cmd: kubectl get nodes --no-headers
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: n8n_k3s_nodes_check
  changed_when: false
  failed_when: n8n_k3s_nodes_check.rc != 0
  when: n8n_enabled

- name: Ensure n8n namespace exists
  ansible.builtin.command:
    cmd: kubectl create namespace {{ n8n_namespace }} --dry-run=client -o yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: n8n_namespace_manifest
  changed_when: false
  when: n8n_enabled

- name: Apply n8n namespace
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: "{{ n8n_namespace_manifest.stdout }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: n8n_namespace_apply
  changed_when: "'created' in n8n_namespace_apply.stdout or 'configured' in n8n_namespace_apply.stdout"
  when:
    - n8n_enabled
    - not ansible_check_mode

- name: Render n8n k3s manifest
  ansible.builtin.copy:
    dest: /tmp/n8n-k3s.yaml
    mode: "0644"
    content: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: {{ n8n_app_name }}-data
        namespace: {{ n8n_namespace }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ n8n_storage_size }}
        storageClassName: {{ n8n_storage_class_name }}
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: {{ n8n_app_name }}
        namespace: {{ n8n_namespace }}
      spec:
        replicas: {{ n8n_replicas }}
        selector:
          matchLabels:
            app: {{ n8n_app_name }}
        template:
          metadata:
            labels:
              app: {{ n8n_app_name }}
          spec:
            containers:
              - name: {{ n8n_app_name }}
                image: {{ n8n_deployment_image }}
                imagePullPolicy: IfNotPresent
                ports:
                  - containerPort: 5678
                env:
                  - name: TZ
                    value: "{{ n8n_timezone }}"
                  - name: N8N_PROTOCOL
                    value: "{{ n8n_protocol }}"
                  - name: N8N_HOST
                    value: "0.0.0.0"
                  - name: N8N_PORT
                    value: "5678"
                  - name: N8N_SECURE_COOKIE
                    value: "false"
                  - name: N8N_EDITOR_BASE_URL
                    value: "{{ n8n_protocol }}://{{ n8n_public_host }}:{{ n8n_node_port }}"
                  - name: WEBHOOK_URL
                    value: "{{ n8n_protocol }}://{{ n8n_public_host }}:{{ n8n_node_port }}{{ n8n_webhook_path }}"
                volumeMounts:
                  - name: n8n-data
                    mountPath: /home/node/.n8n
            volumes:
              - name: n8n-data
                persistentVolumeClaim:
                  claimName: {{ n8n_app_name }}-data
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: {{ n8n_app_name }}
        namespace: {{ n8n_namespace }}
      spec:
        type: {{ n8n_service_type }}
        selector:
          app: {{ n8n_app_name }}
        ports:
          - name: http
            port: {{ n8n_service_port }}
            targetPort: 5678
      {% if n8n_service_type == 'NodePort' %}
            nodePort: {{ n8n_node_port }}
      {% endif %}
  when: n8n_enabled

- name: Apply n8n k3s manifest
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/n8n-k3s.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: n8n_manifest_apply
  changed_when: "'created' in n8n_manifest_apply.stdout or 'configured' in n8n_manifest_apply.stdout"
  when:
    - n8n_enabled
    - not ansible_check_mode

- name: Wait for n8n rollout
  ansible.builtin.command:
    cmd: kubectl -n {{ n8n_namespace }} rollout status deployment/{{ n8n_app_name }} --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: n8n_rollout
  changed_when: false
  when:
    - n8n_enabled
    - not ansible_check_mode

- name: Wait for n8n API endpoint to become reachable
  ansible.builtin.wait_for:
    host: "{{ n8n_api_host }}"
    port: "{{ n8n_node_port }}"
    timeout: 120
    connect_timeout: 5
    state: started
  changed_when: false
  when:
    - n8n_enabled
    - not ansible_check_mode
    - n8n_rollout is defined
    - n8n_rollout.rc == 0

- name: Wait for n8n REST API initialization
  ansible.builtin.uri:
    url: "{{ n8n_protocol }}://{{ n8n_api_host }}:{{ n8n_node_port }}/rest/settings"
    method: GET
    return_content: true
    status_code: [200, 404, 503]
    timeout: 15
    validate_certs: false
  register: n8n_api_settings
  retries: 60
  delay: 2
  until: (n8n_api_settings.status | default(0)) == 200
  changed_when: false
  failed_when: false
  when:
    - n8n_enabled
    - not ansible_check_mode
    - n8n_rollout is defined
    - n8n_rollout.rc == 0

- name: Assert n8n REST API initialization completed
  ansible.builtin.assert:
    that:
      - (n8n_api_settings.status | default(0)) == 200
    fail_msg: "n8n REST API did not become ready within the configured timeout."
  when:
    - n8n_enabled
    - not ansible_check_mode
    - n8n_rollout is defined
    - n8n_rollout.rc == 0

- name: Set up initial n8n owner
  ansible.builtin.uri:
    url: "{{ n8n_protocol }}://{{ n8n_api_host }}:{{ n8n_node_port }}/rest/owner/setup"
    method: POST
    body_format: json
    body:
      email: "{{ n8n_owner_email }}"
      firstName: "{{ n8n_owner_first_name }}"
      lastName: "{{ n8n_owner_last_name }}"
      password: "{{ n8n_owner_password_plain }}"
    return_content: true
    status_code: [200, 201]
    timeout: 15
    validate_certs: false
  register: n8n_owner_setup
  no_log: true
  when:
    - n8n_enabled
    - not ansible_check_mode
    - n8n_rollout is defined
    - n8n_rollout.rc == 0
    - n8n_api_settings.json.data.userManagement.showSetupOnFirstLoad | default(false) | bool

- name: Login to n8n REST API
  ansible.builtin.uri:
    url: "{{ n8n_protocol }}://{{ n8n_api_host }}:{{ n8n_node_port }}/rest/login"
    method: POST
    body_format: json
    body:
      emailOrLdapLoginId: "{{ n8n_owner_email }}"
      password: "{{ n8n_owner_password_plain }}"
    return_content: true
    status_code: 200
    timeout: 15
    validate_certs: false
  register: n8n_api_login
  no_log: true
  when:
    - n8n_enabled
    - not ansible_check_mode
    - n8n_rollout is defined
    - n8n_rollout.rc == 0

- name: Get existing workflows from n8n
  ansible.builtin.uri:
    url: "{{ n8n_protocol }}://{{ n8n_api_host }}:{{ n8n_node_port }}/rest/workflows"
    method: GET
    headers:
      Cookie: "{{ n8n_api_login.cookies_string }}"
    return_content: true
    status_code: 200
    timeout: 15
    validate_certs: false
  register: n8n_workflows_list
  when:
    - n8n_enabled
    - not ansible_check_mode
    - n8n_rollout is defined
    - n8n_rollout.rc == 0

- name: Resolve existing workflow id
  ansible.builtin.set_fact:
    n8n_existing_workflow_id: >-
      {{
        (
          (
            n8n_workflows_list.json.data
            if (n8n_workflows_list.json is mapping and 'data' in n8n_workflows_list.json)
            else (n8n_workflows_list.json | default([]))
          )
          | selectattr('name', 'equalto', n8n_workflow_name)
          | map(attribute='id')
          | list
          | last
        ) | default('')
      }}
    n8n_existing_workflow_version_id: >-
      {{
        (
          (
            n8n_workflows_list.json.data
            if (n8n_workflows_list.json is mapping and 'data' in n8n_workflows_list.json)
            else (n8n_workflows_list.json | default([]))
          )
          | selectattr('name', 'equalto', n8n_workflow_name)
          | map(attribute='versionId')
          | list
          | last
        ) | default('')
      }}
  changed_when: false
  when:
    - n8n_enabled
    - not ansible_check_mode
    - n8n_rollout is defined
    - n8n_rollout.rc == 0

- name: Create EVA Alert workflow if absent
  ansible.builtin.uri:
    url: "{{ n8n_protocol }}://{{ n8n_api_host }}:{{ n8n_node_port }}/rest/workflows"
    method: POST
    headers:
      Cookie: "{{ n8n_api_login.cookies_string }}"
    body_format: json
    body:
      name: "{{ n8n_workflow_name }}"
      active: false
      nodes:
        - id: "Webhook"
          name: "Webhook"
          type: "n8n-nodes-base.webhook"
          typeVersion: 2
          position: [260, 300]
          parameters:
            path: "{{ n8n_workflow_webhook_node_path }}"
            httpMethod: "POST"
            responseMode: "onReceived"
      connections: {}
      settings: {}
    return_content: true
    status_code: [200, 201]
    timeout: 15
    validate_certs: false
  register: n8n_create_workflow
  when:
    - n8n_enabled
    - not ansible_check_mode
    - n8n_rollout is defined
    - n8n_rollout.rc == 0
    - (n8n_existing_workflow_id | default('')) == ''

- name: Resolve target workflow id
  ansible.builtin.set_fact:
    n8n_target_workflow_id: >-
      {{
        (n8n_existing_workflow_id | default(''))
        if (n8n_existing_workflow_id | default('')) != ''
        else
        (
          (n8n_create_workflow.json.data.id | string)
          if (n8n_create_workflow is defined and n8n_create_workflow.json is mapping and 'data' in n8n_create_workflow.json and 'id' in n8n_create_workflow.json.data)
          else (n8n_create_workflow.json.id | default('') | string)
        )
      }}
    n8n_target_workflow_version_id: >-
      {{
        (n8n_existing_workflow_version_id | default(''))
        if (n8n_existing_workflow_version_id | default('')) != ''
        else
        (
          (n8n_create_workflow.json.data.versionId | string)
          if (n8n_create_workflow is defined and n8n_create_workflow.json is mapping and 'data' in n8n_create_workflow.json and 'versionId' in n8n_create_workflow.json.data)
          else (n8n_create_workflow.json.versionId | default('') | string)
        )
      }}
  changed_when: false
  when:
    - n8n_enabled
    - not ansible_check_mode
    - n8n_rollout is defined
    - n8n_rollout.rc == 0

- name: Activate EVA Alert workflow
  ansible.builtin.uri:
    url: "{{ n8n_protocol }}://{{ n8n_api_host }}:{{ n8n_node_port }}/rest/workflows/{{ n8n_target_workflow_id }}"
    method: PATCH
    headers:
      Cookie: "{{ n8n_api_login.cookies_string }}"
    body_format: json
    body:
      active: true
      versionId: "{{ n8n_target_workflow_version_id }}"
    return_content: true
    status_code: [200, 204]
    timeout: 15
    validate_certs: false
  register: n8n_activate_workflow
  when:
    - n8n_enabled
    - not ansible_check_mode
    - n8n_rollout is defined
    - n8n_rollout.rc == 0
    - (n8n_target_workflow_id | default('')) != ''
    - (n8n_target_workflow_version_id | default('')) != ''

- name: Show n8n k3s endpoint info
  ansible.builtin.debug:
    msg:
      - "n8n namespace/service: {{ n8n_namespace }}/{{ n8n_app_name }}"
      - "Service type: {{ n8n_service_type }}"
      - "Cluster access: kubectl -n {{ n8n_namespace }} port-forward svc/{{ n8n_app_name }} 5678:{{ n8n_service_port }}"
      - "External access: {{ n8n_protocol }}://{{ n8n_public_host }}:{{ n8n_node_port }} (NodePort)"
      - "Webhook base: {{ n8n_protocol }}://{{ n8n_public_host }}:{{ n8n_node_port }}{{ n8n_webhook_path }}"
      - "Workflow name: {{ n8n_workflow_name }}"
      - "Workflow id: {{ n8n_target_workflow_id | default('') }}"
      - "Bootstrap owner: {{ n8n_owner_email }}"
  when: n8n_enabled

- name: Ensure local n8n config output directory exists on control node
  ansible.builtin.file:
    path: "{{ n8n_config_output_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  when:
    - n8n_enabled
    - not ansible_check_mode
    - n8n_rollout is defined
    - n8n_rollout.rc == 0

- name: Write n8n.yaml on control node
  ansible.builtin.copy:
    dest: "{{ n8n_config_output_dir }}/n8n.yaml"
    mode: "0600"
    content: |
      endpoint: "{{ n8n_protocol }}://{{ n8n_public_host }}:{{ n8n_node_port }}"
      webhook_base: "{{ n8n_protocol }}://{{ n8n_public_host }}:{{ n8n_node_port }}{{ n8n_webhook_path }}"
      workflow_name: "{{ n8n_workflow_name }}"
      workflow_id: "{{ n8n_target_workflow_id | default('') }}"
      namespace: "{{ n8n_namespace }}"
      service: "{{ n8n_app_name }}"
      credentials:
        id: "{{ n8n_owner_email }}"
        password: "{{ n8n_owner_password_plain }}"
  delegate_to: localhost
  become: false
  when:
    - n8n_enabled
    - not ansible_check_mode
    - n8n_rollout is defined
    - n8n_rollout.rc == 0
