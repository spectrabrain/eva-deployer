- name: Set EVA Vision install defaults (k3s/on-premise)
  ansible.builtin.set_fact:
    repository_mode: "{{ repository_mode | default('online_repository') }}"
    repository_project: "{{ repository_project | default('eva') }}"
    repository_registry: >-
      {{
        repository_registry
        | default(harbor_registry | default(((repository_mode | default('online_repository')) == 'local_repository') | ternary('localhost:32080', '')))
        | regex_replace('^https?://', '')
        | regex_replace('/+$', '')
      }}
    airgap_mode: "{{ (airgap_mode | default(false) | bool) or ((repository_mode | default('online_repository')) in ['remote_repository', 'local_repository']) }}"
    eva_vision_namespace: "{{ eva_vision_namespace | default('eva-vision') }}"
    eva_vision_name: "{{ eva_vision_name | default(eva_vision_release | default('eva-vision')) }}"
    eva_vision_deploy_version: "{{ eva_vision_deploy_version | mandatory }}"
    eva_vision_deploy_values_dir: "{{ eva_vision_deploy_values_dir | default(eva_site_deploy_root ~ '/' ~ (ansible_host | default(inventory_hostname)) ~ '/vision') }}"
    eva_vision_kubeconfig: "{{ eva_vision_kubeconfig | default(ansible_facts['env']['HOME'] ~ '/.kube/config') }}"
    eva_vision_chart_ref: "{{ eva_vision_chart_ref | default('eva-vision/eva-vision') }}"
    eva_vision_chart_version: "{{ eva_vision_chart_version | mandatory }}"
    eva_vision_image_tag: "{{ eva_vision_image_tag | default(eva_vision_chart_version) }}"
    eva_vision_offline_dir: "{{ eva_vision_offline_dir | default(eva_cache_root ~ '/eva-vision') }}"

- name: Resolve derived EVA Vision install paths
  ansible.builtin.set_fact:
    eva_vision_workdir: "{{ eva_vision_workdir | default('/opt/eva-vision/' ~ eva_vision_deploy_version) }}"
    eva_vision_offline_chart_tgz: "{{ eva_vision_offline_chart_tgz | default(eva_vision_offline_dir ~ '/eva-vision-' ~ eva_vision_chart_version ~ '.tgz') }}"
    eva_vision_gpu_count: "{{ eva_vision_gpu_count | default(1) }}"
    eva_vision_gpu_resource_name: "{{ eva_vision_gpu_resource_name | default('') }}"
    eva_vision_pvc_size: "{{ eva_vision_pvc_size | default('20Gi') }}"
    eva_vision_storage_class: "{{ eva_vision_storage_class | default('local-path') }}"
    # Include the first large image pull and external model preparation in the wait budget.
    eva_vision_rollout_timeout: "{{ eva_vision_rollout_timeout | default('7200s') }}"
    eva_vision_progress_deadline_seconds: "{{ eva_vision_progress_deadline_seconds | default(7200) }}"
    eva_vision_skip_startup_warmup: "{{ eva_vision_skip_startup_warmup | default(true) }}"
    eva_vision_chart_repo_url: >-
      {{ eva_vision_chart_repo_url | default(
           (eva_vision_chart_version is version('3.3.0', '>='))
           | ternary('https://raw.githubusercontent.com/spectrabrain/eva-vision-chart/chartmuseum/',
                     'https://raw.githubusercontent.com/mellerikat/eva-vision/chartmuseum/')) }}

- name: Load target-specific EVA Vision Workspace values
  ansible.builtin.import_tasks: workspace_values.yaml

- name: Validate repository mode for EVA Vision
  ansible.builtin.assert:
    that:
      - repository_mode in ['online_repository', 'cloud_repository', 'remote_repository', 'local_repository']
      - repository_mode in ['online_repository', 'cloud_repository'] or repository_registry | length > 0
    fail_msg: >-
      repository_mode은 online_repository, remote_repository, local_repository 중 하나여야 합니다 (cloud_repository는 호환 입력).
      remote_repository/local_repository 모드에서는 repository_registry 또는 harbor_registry가 필요합니다.

- name: Resolve EVA Vision image repository
  ansible.builtin.set_fact:
    eva_vision_image_repository: >-
      {{
        eva_vision_image_repository | default(
          (repository_mode in ['online_repository', 'cloud_repository'])
          | ternary(
              (eva_vision_chart_version is version('3.3.0', '>='))
              | ternary('211722900905.dkr.ecr.ap-northeast-2.amazonaws.com/spectrabrain/eva-vision',
                  '339713051385.dkr.ecr.ap-northeast-2.amazonaws.com/mellerikat/release/eva-vision'),
              repository_registry ~ '/' ~ repository_project ~ '/eva-vision'
            )
        )
      }}

- name: Resolve EVA Vision accelerator resource
  ansible.builtin.import_tasks: gpu_resource.yaml

- name: Preserve existing EVA Vision Helm user Values
  ansible.builtin.include_role:
    name: eva_helm_values_backup
  vars:
    eva_helm_backup_namespace: "{{ eva_vision_namespace }}"
    eva_helm_backup_release: "{{ eva_vision_name }}"
    eva_helm_backup_component: vision
    eva_helm_backup_kubeconfig: "{{ eva_vision_kubeconfig }}"

- name: Remove EVA Vision workspace if it exists
  ansible.builtin.file:
    path: "{{ eva_vision_workdir }}"
    state: absent

- name: Ensure EVA Vision workspace exists
  ansible.builtin.file:
    path: "{{ eva_vision_workdir }}"
    state: directory
    mode: "0755"

- name: Copy CLI EVA Vision chart override to target workspace
  ansible.builtin.copy:
    src: "{{ eva_cli_chart_path }}"
    dest: "{{ eva_vision_workdir }}/cli-chart.tgz"
    mode: "0644"
  when: eva_cli_chart_path | default('') | length > 0

- name: Resolve EVA Vision chart source
  ansible.builtin.set_fact:
    eva_vision_chart_source: >-
      {{
        (eva_cli_chart_path | default('') | length > 0)
        | ternary(
          eva_vision_workdir ~ '/cli-chart.tgz',
          (airgap_mode | default(false) | bool)
          | ternary(eva_vision_offline_chart_tgz, eva_vision_chart_ref)
        )
      }}
  changed_when: false

- name: Check NVIDIA device plugin daemonset exists
  ansible.builtin.command: kubectl get daemonset -A -o name
  register: daemonsets_result
  changed_when: false
  check_mode: false
  environment:
    KUBECONFIG: "{{ eva_vision_kubeconfig }}"

- name: Validate NVIDIA device plugin prerequisite
  ansible.builtin.assert:
    that:
      - "'nvidia-device-plugin' in daemonsets_result.stdout"
    fail_msg: "NVIDIA Device Plugin daemonset is not installed. Install it before EVA Vision deployment."
    success_msg: "NVIDIA Device Plugin daemonset detected."

- name: Add Helm repository for EVA Vision
  ansible.builtin.command: >-
    helm repo add eva-vision {{ eva_vision_chart_repo_url | quote }} --force-update
  register: helm_repo_eva_vision
  changed_when: "'already exists' not in (helm_repo_eva_vision.stdout + helm_repo_eva_vision.stderr)"
  failed_when:
    - helm_repo_eva_vision.rc != 0
    - "'already exists' not in (helm_repo_eva_vision.stdout + helm_repo_eva_vision.stderr)"
  when:
    - not (airgap_mode | default(false) | bool)
    - eva_cli_chart_path | default('') | length == 0
  environment:
    KUBECONFIG: "{{ eva_vision_kubeconfig }}"

- name: Update Helm repositories
  ansible.builtin.command: helm repo update
  changed_when: true
  when:
    - not (airgap_mode | default(false) | bool)
    - eva_cli_chart_path | default('') | length == 0
  environment:
    KUBECONFIG: "{{ eva_vision_kubeconfig }}"

- name: Ensure offline EVA Vision chart exists
  ansible.builtin.stat:
    path: "{{ eva_vision_offline_chart_tgz }}"
  register: eva_vision_offline_chart
  when:
    - airgap_mode | default(false) | bool
    - eva_cli_chart_path | default('') | length == 0

- name: Assert offline EVA Vision chart is prepared
  ansible.builtin.assert:
    that:
      - eva_vision_offline_chart.stat.exists
    fail_msg: >-
      airgap_mode=true 인 경우 {{ eva_vision_offline_chart_tgz }} 파일이 필요합니다.
      scripts/download/download_offline_assets.sh 를 먼저 실행하세요.
  when:
    - airgap_mode | default(false) | bool
    - eva_cli_chart_path | default('') | length == 0

- name: Export default values.yaml from EVA Vision chart
  ansible.builtin.shell: >-
    helm show values {{ eva_vision_chart_source | quote }}
    {% if eva_cli_chart_path | default('') | length == 0 %}--version {{ eva_vision_chart_version | quote }}{% endif %}
    > {{ (eva_vision_workdir ~ '/values.yaml') | quote }}
  args:
    executable: /bin/bash
  changed_when: false
  environment:
    KUBECONFIG: "{{ eva_vision_kubeconfig }}"

- name: Ensure EVA Vision deploy values directory exists on control node
  ansible.builtin.file:
    path: "{{ eva_vision_deploy_values_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

- name: Record EVA Vision chart defaults on control node
  ansible.builtin.fetch:
    src: "{{ eva_vision_workdir }}/values.yaml"
    dest: "{{ eva_vision_deploy_values_dir }}/chart-defaults.yaml"
    flat: true
  when: not ansible_check_mode

- name: Publish EVA Vision chart defaults on control node
  ansible.builtin.file:
    path: "{{ eva_vision_deploy_values_dir }}/chart-defaults.yaml"
    mode: "0644"
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

- name: Render EVA Vision k3s override values on control node
  no_log: true
  ansible.builtin.template:
    src: "{{ eva_template_values_root }}/vision-k3s-override.yaml.j2"
    dest: "{{ eva_vision_deploy_values_dir }}/vision-k3s-override.yaml"
    mode: "0644"
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

- name: Copy EVA Vision k3s override values to target workspace
  no_log: true
  ansible.builtin.copy:
    src: "{{ eva_vision_deploy_values_dir }}/vision-k3s-override.yaml"
    dest: "{{ eva_vision_workdir }}/vision-k3s-override.yaml"
    mode: "0644"
  when: not ansible_check_mode

- name: Read EVA Vision chart and generated input values
  no_log: true
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ eva_vision_workdir }}/values.yaml"
    - "{{ eva_vision_workdir }}/vision-k3s-override.yaml"
  register: eva_vision_generated_values_raw
  when: not ansible_check_mode

- name: Load CLI EVA Vision values override
  no_log: true
  ansible.builtin.set_fact:
    eva_vision_cli_values_override: "{{ lookup('ansible.builtin.file', eva_cli_values_path) | from_yaml }}"
  when: eva_cli_values_path | default('') | length > 0

- name: Build effective EVA Vision Helm input values
  no_log: true
  ansible.builtin.set_fact:
    eva_vision_effective_values: >-
      {{ (eva_vision_generated_values_raw.results[0].content | b64decode | from_yaml)
         | combine(eva_vision_generated_values_raw.results[1].content | b64decode | from_yaml, recursive=true)
         | combine(eva_vision_workspace_chart_values, recursive=true)
         | combine(eva_vision_cli_values_override | default({}, true), recursive=true) }}
  when: not ansible_check_mode

- name: Record private EVA Vision effective input values on control node
  no_log: true
  ansible.builtin.copy:
    content: "{{ eva_vision_effective_values | to_nice_yaml(indent=2, sort_keys=false) }}"
    dest: "{{ eva_vision_deploy_values_dir }}/effective-input-values.yaml"
    mode: "0600"
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

- name: Copy private EVA Vision effective input values to target workspace
  no_log: true
  ansible.builtin.copy:
    src: "{{ eva_vision_deploy_values_dir }}/effective-input-values.yaml"
    dest: "{{ eva_vision_workdir }}/effective-input-values.yaml"
    mode: "0600"
  when: not ansible_check_mode

- name: Record EVA Vision values source metadata on control node
  ansible.builtin.copy:
    content: |
      config_generated_values: {{ (eva_vision_mig_enabled_from_config | default(false) | bool) | lower }}
      workspace_override: {{ (eva_vision_workspace_values | length > 0) | lower }}
      cli_override: {{ ((eva_cli_values_path | default('') | length > 0) or (eva_cli_helm_set | default([]) | length > 0)) | lower }}
      rendered_artifacts:
        chart_defaults: {{ eva_vision_deploy_values_dir }}/chart-defaults.yaml
        effective_input_values: {{ eva_vision_deploy_values_dir }}/effective-input-values.yaml
        resolved_values: {{ eva_vision_deploy_values_dir }}/resolved-values.yaml
    dest: "{{ eva_vision_deploy_values_dir }}/values-sources.yaml"
    mode: "0644"
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

- name: Prepare EVA Vision external model runtime
  ansible.builtin.include_tasks: model_runtime.yaml
  when:
    - not ansible_check_mode
    - eva_vision_chart_version is version('3.3.0', '>=')

- name: Prepare EVA Vision image pull authentication
  ansible.builtin.include_tasks: image_pull_secret.yaml
  when:
    - not ansible_check_mode
    - eva_vision_chart_version is version('3.3.0', '>=')

- name: Check existing EVA Vision deployment
  no_log: true
  ansible.builtin.command: kubectl get deployment {{ eva_vision_name }} -n {{ eva_vision_namespace }} -o json
  register: eva_vision_deployment_exists
  changed_when: false
  failed_when: false
  when: not ansible_check_mode
  environment:
    KUBECONFIG: "{{ eva_vision_kubeconfig }}"

- name: Resolve EVA Vision Helm field ownership reconciliation arguments
  vars:
    eva_vision_upgrade_deployment: >-
      {{ (eva_vision_deployment_exists.stdout | from_json)
         if eva_vision_deployment_exists.rc == 0 else {} }}
  ansible.builtin.set_fact:
    eva_vision_server_side_conflict_args: >-
      {{ (eva_vision_upgrade_deployment.get('metadata', {}).get('name') == eva_vision_name
          and eva_vision_upgrade_deployment.get('metadata', {}).get('namespace') == eva_vision_namespace
          and eva_vision_upgrade_deployment.get('metadata', {}).get('labels', {}).get('app.kubernetes.io/managed-by') == 'Helm'
          and eva_vision_upgrade_deployment.get('metadata', {}).get('annotations', {}).get('meta.helm.sh/release-name') == eva_vision_name
          and eva_vision_upgrade_deployment.get('metadata', {}).get('annotations', {}).get('meta.helm.sh/release-namespace') == eva_vision_namespace)
         | ternary('--server-side=true --force-conflicts', '') }}
  changed_when: false
  when: not ansible_check_mode

- name: Scale down existing EVA Vision deployment before reinstall
  ansible.builtin.command: >-
    kubectl scale deployment {{ eva_vision_name }} -n {{ eva_vision_namespace }} --replicas=0
  register: eva_vision_scale_down
  changed_when: "'scaled' in eva_vision_scale_down.stdout"
  when:
    - not ansible_check_mode
    - eva_vision_deployment_exists.rc == 0
  environment:
    KUBECONFIG: "{{ eva_vision_kubeconfig }}"

- name: Force delete remaining EVA Vision pods before reinstall
  ansible.builtin.command: >-
    kubectl delete pod
    -n {{ eva_vision_namespace }}
    -l app.kubernetes.io/instance={{ eva_vision_name }}
    --ignore-not-found=true
    --grace-period=0
    --force
  register: eva_vision_force_delete
  changed_when: "'deleted' in eva_vision_force_delete.stdout"
  when:
    - not ansible_check_mode
    - eva_vision_deployment_exists.rc == 0
  environment:
    KUBECONFIG: "{{ eva_vision_kubeconfig }}"

- name: Wait until EVA Vision pods are terminated before reinstall
  ansible.builtin.command: >-
    kubectl wait --for=delete pod
    -n {{ eva_vision_namespace }}
    -l app.kubernetes.io/instance={{ eva_vision_name }}
    --timeout=180s
  register: eva_vision_wait_delete
  changed_when: false
  failed_when:
    - eva_vision_wait_delete.rc != 0
    - "'no matching resources found' not in eva_vision_wait_delete.stderr"
  when:
    - not ansible_check_mode
    - eva_vision_deployment_exists.rc == 0
  environment:
    KUBECONFIG: "{{ eva_vision_kubeconfig }}"

- name: Ensure EVA Vision Helm post-renderer plugin directory exists
  ansible.builtin.file:
    path: "{{ eva_vision_workdir }}/plugin/eva-vision-postrenderer"
    state: directory
    mode: "0755"
  when: not ansible_check_mode

- name: Render EVA Vision Helm post-renderer plugin metadata
  ansible.builtin.template:
    src: post-renderer/plugin.yaml.j2
    dest: "{{ eva_vision_workdir }}/plugin/eva-vision-postrenderer/plugin.yaml"
    mode: "0644"
  when: not ansible_check_mode

- name: Render EVA Vision Helm post-renderer
  ansible.builtin.template:
    src: post-renderer/post-renderer.py.j2
    dest: "{{ eva_vision_workdir }}/plugin/eva-vision-postrenderer/post-renderer.py"
    mode: "0755"
  when: not ansible_check_mode

- name: Ensure EVA Vision Helm post-renderer is executable
  ansible.builtin.file:
    path: "{{ eva_vision_workdir }}/plugin/eva-vision-postrenderer/post-renderer.py"
    mode: "0755"
  when: not ansible_check_mode

- name: Verify Helm recognizes the EVA Vision post-renderer plugin
  ansible.builtin.command: helm plugin list
  register: eva_vision_helm_plugins
  changed_when: false
  when: not ansible_check_mode
  environment:
    HELM_PLUGINS: "{{ eva_vision_workdir }}/plugin"

- name: Assert Helm recognizes the EVA Vision post-renderer plugin
  ansible.builtin.assert:
    that:
      - eva_vision_helm_plugins.stdout is search('(^|\\n)eva-vision-postrenderer\\s')
    fail_msg: EVA Vision Helm post-renderer plugin was not recognized.
  when: not ansible_check_mode

- name: Render and verify final EVA Vision Helm manifest before deployment
  no_log: >-
    {{
      (eva_cli_values_path | default('') | length > 0)
      or
      (eva_cli_helm_set | default([]) | length > 0)
    }}
  ansible.builtin.shell: >-
    helm template {{ eva_vision_name }} {{ eva_vision_chart_source }}
    -n {{ eva_vision_namespace }}
    {% if eva_cli_chart_path | default('') | length == 0 %}--version {{ eva_vision_chart_version }}{% endif %}
    -f {{ eva_vision_workdir }}/effective-input-values.yaml
    --post-renderer eva-vision-postrenderer
    {% for value in eva_cli_helm_set | default([]) %}--set {{ value | quote }} {% endfor %}
    > /dev/null
  args:
    executable: /bin/bash
  changed_when: false
  when: not ansible_check_mode
  environment:
    KUBECONFIG: "{{ eva_vision_kubeconfig }}"
    HELM_PLUGINS: "{{ eva_vision_workdir }}/plugin"

- name: Reconcile exact legacy Argo CD-managed EVA Vision resources
  ansible.builtin.include_tasks: reconcile_vision.yaml
  when: not ansible_check_mode

- name: Deploy EVA Vision from online Helm repo
  no_log: "{{ (eva_cli_values_path | default('') | length > 0) or (eva_cli_helm_set | default([]) | length > 0) }}"
  ansible.builtin.command: >-
    helm upgrade --install {{ eva_vision_name }} {{ eva_vision_chart_source }}
    -n {{ eva_vision_namespace }}
    {% if eva_cli_chart_path | default('') | length == 0 %}--version {{ eva_vision_chart_version }}{% endif %}
    --create-namespace
    -f {{ eva_vision_workdir }}/effective-input-values.yaml
    --post-renderer eva-vision-postrenderer
    {{ eva_vision_server_side_conflict_args | default('') }}
    {% for value in eva_cli_helm_set | default([]) %}--set {{ value | quote }} {% endfor %}
  register: eva_vision_deploy_online
  changed_when: >-
    'has been upgraded' in eva_vision_deploy_online.stdout
    or 'has been installed' in eva_vision_deploy_online.stdout
  when: not (airgap_mode | default(false) | bool)
  environment:
    KUBECONFIG: "{{ eva_vision_kubeconfig }}"
    HELM_PLUGINS: "{{ eva_vision_workdir }}/plugin"

- name: Deploy EVA Vision from offline chart
  no_log: "{{ (eva_cli_values_path | default('') | length > 0) or (eva_cli_helm_set | default([]) | length > 0) }}"
  ansible.builtin.command: >-
    helm upgrade --install {{ eva_vision_name }} {{ eva_vision_chart_source }}
    -n {{ eva_vision_namespace }}
    {% if eva_cli_chart_path | default('') | length == 0 %}--version {{ eva_vision_chart_version }}{% endif %}
    --create-namespace
    -f {{ eva_vision_workdir }}/effective-input-values.yaml
    --post-renderer eva-vision-postrenderer
    {{ eva_vision_server_side_conflict_args | default('') }}
    {% for value in eva_cli_helm_set | default([]) %}--set {{ value | quote }} {% endfor %}
  register: eva_vision_deploy_offline
  changed_when: >-
    'has been upgraded' in eva_vision_deploy_offline.stdout
    or 'has been installed' in eva_vision_deploy_offline.stdout
  when: airgap_mode | default(false) | bool
  environment:
    KUBECONFIG: "{{ eva_vision_kubeconfig }}"
    HELM_PLUGINS: "{{ eva_vision_workdir }}/plugin"

- name: Capture effective EVA Vision Helm values
  no_log: true
  ansible.builtin.shell: >-
    helm get values {{ eva_vision_name }} --namespace {{ eva_vision_namespace }} --all --output yaml
    > {{ eva_vision_workdir }}/resolved-values.yaml
  args:
    executable: /bin/bash
  changed_when: false
  when: not ansible_check_mode
  environment:
    KUBECONFIG: "{{ eva_vision_kubeconfig }}"

- name: Record effective EVA Vision Helm values on control node
  no_log: true
  ansible.builtin.fetch:
    src: "{{ eva_vision_workdir }}/resolved-values.yaml"
    dest: "{{ eva_vision_deploy_values_dir }}/resolved-values.yaml"
    flat: true
  when: not ansible_check_mode

- name: Publish effective EVA Vision Helm values on control node
  ansible.builtin.file:
    path: "{{ eva_vision_deploy_values_dir }}/resolved-values.yaml"
    mode: "0600"
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

- name: Wait for EVA Vision deployment rollout
  block:
    - name: Check EVA Vision deployment rollout status
      ansible.builtin.command: >-
        kubectl rollout status deployment/{{ eva_vision_name }}
        -n {{ eva_vision_namespace }}
        --timeout={{ eva_vision_rollout_timeout }}
      register: rollout_result
      changed_when: false
      environment:
        KUBECONFIG: "{{ eva_vision_kubeconfig }}"
  rescue:
    - name: Collect EVA Vision pods on rollout failure
      ansible.builtin.command: >-
        kubectl get pod -n {{ eva_vision_namespace }} -o wide
      register: eva_vision_pods_on_fail
      changed_when: false
      failed_when: false
      environment:
        KUBECONFIG: "{{ eva_vision_kubeconfig }}"

    - name: Collect EVA Vision container states on rollout failure
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pod
          - -n
          - "{{ eva_vision_namespace }}"
          - -l
          - "app.kubernetes.io/name={{ eva_vision_name }}"
          - -o
          - "custom-columns=NAME:.metadata.name,PHASE:.status.phase,READY:.status.containerStatuses[*].ready,WAITING:.status.containerStatuses[*].state.waiting.reason,TERMINATED:.status.containerStatuses[*].state.terminated.reason,IMAGE:.spec.containers[*].image,IMAGE_ID:.status.containerStatuses[*].imageID"
      register: eva_vision_container_states_on_fail
      changed_when: false
      failed_when: false
      environment:
        KUBECONFIG: "{{ eva_vision_kubeconfig }}"

    - name: Collect EVA Vision pod describe on rollout failure
      ansible.builtin.shell: >-
        kubectl describe pod -n {{ eva_vision_namespace }} -l app.kubernetes.io/name={{ eva_vision_name }}
      args:
        executable: /bin/bash
      register: eva_vision_pod_describe_on_fail
      changed_when: false
      failed_when: false
      environment:
        KUBECONFIG: "{{ eva_vision_kubeconfig }}"

    - name: Collect EVA Vision namespace events on rollout failure
      ansible.builtin.command: >-
        kubectl get events -n {{ eva_vision_namespace }} --sort-by=.metadata.creationTimestamp
      register: eva_vision_events_on_fail
      changed_when: false
      failed_when: false
      environment:
        KUBECONFIG: "{{ eva_vision_kubeconfig }}"

    - name: Print EVA Vision rollout diagnostics
      ansible.builtin.debug:
        msg:
          - "rollout failed for deployment/{{ eva_vision_name }} in namespace {{ eva_vision_namespace }}"
          - "pods:"
          - "{{ eva_vision_pods_on_fail.stdout_lines | default([]) }}"
          - "container states:"
          - "{{ eva_vision_container_states_on_fail.stdout_lines | default([]) }}"
          - "events:"
          - "{{ eva_vision_events_on_fail.stdout_lines | default([]) }}"
          - "describe:"
          - "{{ eva_vision_pod_describe_on_fail.stdout_lines | default([]) }}"

    - name: Fail with actionable EVA Vision rollout message
      ansible.builtin.fail:
        msg: >-
          EVA Vision rollout did not complete within {{ eva_vision_rollout_timeout }}
          (repository_mode={{ repository_mode }}).
          {% if repository_mode in ['online_repository', 'cloud_repository'] %}
          Online 이미지 다운로드 상태와 registry 연결·인증, 노드 디스크 여유 공간을 확인하세요.
          {% else %}
          Harbor의 이미지 게시 상태와 Target의 registry 연결·인증, 노드 디스크 여유 공간을 확인하세요.
          {% endif %}
          image={{ eva_vision_runtime_values.image.repository | default(eva_vision_image_repository) }}:{{ eva_vision_runtime_values.image.tag | default(eva_vision_image_tag) }}.
          위 container states와 events에서 이미지 준비 단계인지 서비스 시작 단계인지 확인하세요.
          이미지 다운로드·모델 준비는 명령 종료 후에도 계속될 수 있으므로 재시도 전에 Pod 상태를 확인하세요.

- name: Check EVA Vision pods
  ansible.builtin.command: kubectl get pod -n {{ eva_vision_namespace }}
  register: eva_vision_pods
  changed_when: false
  environment:
    KUBECONFIG: "{{ eva_vision_kubeconfig }}"

- name: Show EVA Vision pod status
  ansible.builtin.debug:
    msg: "{{ eva_vision_pods.stdout_lines }}"
