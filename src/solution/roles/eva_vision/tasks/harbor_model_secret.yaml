# Reconcile the selected model Secret on the TARGET, like namespace image pulls.
# Only exact current Harbor auth is used; never select a previous Harbor or
# change project visibility. No credentials enter Helm Values or process argv.
- name: Reconcile Vision Harbor model credentials with the current installation
  no_log: true
  vars:
    eva_vision_model_registry: >-
      {{ eva_vision_runtime_values.harbor.registry | trim
         | regex_replace('^https?://', '') | regex_replace('/+$', '') }}
    eva_vision_model_install_registry: >-
      {{ repository_registry | default(eva_vision_runtime_values.harbor.registry) | trim
         | regex_replace('^https?://', '') | regex_replace('/+$', '') }}
  block:
    - name: Check target k3s registry configuration for Vision models
      ansible.builtin.stat:
        path: "{{ eva_vision_registry_config_path | default('/etc/rancher/k3s/registries.yaml') }}"
      register: eva_vision_registry_config_stat

    - name: Read target k3s registry configuration for Vision models
      ansible.builtin.slurp:
        src: "{{ eva_vision_registry_config_path | default('/etc/rancher/k3s/registries.yaml') }}"
      register: eva_vision_registry_config_raw
      when: eva_vision_registry_config_stat.stat.exists

    - name: Parse target k3s registry configuration for Vision models
      ansible.builtin.set_fact:
        eva_vision_registry_config: >-
          {{ (eva_vision_registry_config_raw.content | b64decode | from_yaml)
             if eva_vision_registry_config_stat.stat.exists else {} }}

    - name: Validate target k3s registry configuration mappings
      ansible.builtin.assert:
        that:
          - eva_vision_registry_config is mapping
          - eva_vision_registry_config.get('configs', {}) is mapping
          - eva_vision_registry_config.get('configs', {}).get(eva_vision_model_registry, {}) is mapping
          - eva_vision_registry_config.get('configs', {}).get(eva_vision_model_registry, {}).get('auth', {}) is mapping

    - name: Resolve exact current Harbor model credentials
      ansible.builtin.set_fact:
        eva_vision_model_auth: "{{ eva_vision_registry_config.get('configs', {}).get(eva_vision_model_registry, {}).get('auth', {}) }}"
        # Install credentials belong only to the install registry. A model
        # registry override must use its own exact target auth, never that pair.
        eva_vision_model_username: >-
          {{ (repository_username | default(harbor_admin_user | default('')))
             if eva_vision_model_registry == eva_vision_model_install_registry else '' }}
        eva_vision_model_password: >-
          {{ (repository_password | default(harbor_admin_password | default('')))
             if eva_vision_model_registry == eva_vision_model_install_registry else '' }}

    - name: Validate explicit current Harbor credential pair
      ansible.builtin.assert:
        that:
          - eva_vision_model_username is string
          - eva_vision_model_password is string
          - (eva_vision_model_username | trim | length > 0) == (eva_vision_model_password | trim | length > 0)

    - name: Use current target registry credentials when no explicit pair is supplied
      ansible.builtin.set_fact:
        eva_vision_model_username: "{{ eva_vision_model_auth.get('username', '') }}"
        eva_vision_model_password: "{{ eva_vision_model_auth.get('password', '') }}"
      when: eva_vision_model_username | trim | length == 0

    - name: Validate selected Harbor model credential pair
      ansible.builtin.assert:
        that:
          - eva_vision_model_username is string
          - eva_vision_model_password is string
          - (eva_vision_model_username | trim | length > 0) == (eva_vision_model_password | trim | length > 0)

    - name: Resolve current and desired Vision Harbor model Secret
      ansible.builtin.set_fact:
        eva_vision_model_existing: "{{ (eva_vision_model_secret.stdout | from_json) if eva_vision_model_secret.stdout | length > 0 else {} }}"
        eva_vision_model_desired_data:
          HARBOR_USERNAME: "{{ eva_vision_model_username | b64encode }}"
          HARBOR_PASSWORD: "{{ eva_vision_model_password | b64encode }}"

    - name: Refuse to replace an unrelated Secret type
      ansible.builtin.assert:
        that:
          - eva_vision_model_existing.get('type', 'Opaque') == 'Opaque'
        fail_msg: "The selected Vision model Secret must have type Opaque."

    # Public Harbor without a configured pair must not inherit old credentials.
    # Removing the Secret also requires removing its final Pod env references.
    - name: Remove previous Vision Harbor model Secret for anonymous pulls
      ansible.builtin.command:
        argv: [kubectl, delete, secret, "{{ eva_vision_model_secret_name }}", -n,
               "{{ eva_vision_namespace }}", '--ignore-not-found=true']
      environment:
        KUBECONFIG: "{{ eva_vision_kubeconfig }}"
      changed_when: true
      when:
        - eva_vision_model_username | trim | length == 0
        - eva_vision_model_existing | length > 0

    - name: Disable model credential references for anonymous Harbor pulls
      ansible.builtin.set_fact:
        eva_vision_runtime_values: "{{ eva_vision_runtime_values | combine({'harbor': {'existingSecret': ''}}, recursive=true) }}"
      when: eva_vision_model_username | trim | length == 0

    - name: Prepare current private Harbor model Secret
      when:
        - eva_vision_model_username | trim | length > 0
        - eva_vision_model_existing.get('data', {}) != eva_vision_model_desired_data
      block:
        - name: Create EVA Vision namespace for Harbor model credentials
          ansible.builtin.shell: >-
            set -o pipefail;
            kubectl create namespace {{ eva_vision_namespace | quote }} --dry-run=client -o yaml | kubectl apply -f -
          args:
            executable: /bin/bash
          register: eva_vision_model_namespace
          changed_when: "'created' in eva_vision_model_namespace.stdout"
          environment:
            KUBECONFIG: "{{ eva_vision_kubeconfig }}"

        # replace keeps Secret identity and rejects concurrent resourceVersion
        # changes; create also fails if another writer creates the Secret first.
        - name: Create or replace Vision Harbor model Secret for the selected registry
          ansible.builtin.command:
            argv: [kubectl, "{{ 'replace' if eva_vision_model_existing | length > 0 else 'create' }}", -f, '-']
            stdin: >-
              {{ {'apiVersion': 'v1', 'kind': 'Secret', 'type': 'Opaque',
                  'metadata': {'name': eva_vision_model_secret_name, 'namespace': eva_vision_namespace} | combine(
                    {'resourceVersion': eva_vision_model_existing.metadata.resourceVersion,
                     'labels': eva_vision_model_existing.metadata.get('labels', {}),
                     'annotations': eva_vision_model_existing.metadata.get('annotations', {})}
                    if eva_vision_model_existing | length > 0 else {}),
                  'data': eva_vision_model_desired_data} | to_json }}
          environment:
            KUBECONFIG: "{{ eva_vision_kubeconfig }}"
          changed_when: true
  rescue:
    - name: Explain selected Harbor model authentication recovery
      no_log: false
      ansible.builtin.fail:
        msg: >-
          Cannot prepare Vision Harbor model Secret '{{ eva_vision_model_secret_name }}'
          in namespace '{{ eva_vision_namespace }}' for registry '{{ eva_vision_model_registry }}'.
          Check repository_username/repository_password or the existing EVA infra registry setup
          on this target: configs[registry].auth must contain a complete nonempty string username/password
          pair, or no credentials for anonymous public pulls. Ensure the selected Secret is Opaque
          and Kubernetes allows namespace/Secret changes. Registry configuration and project visibility are preserved.
  always:
    - name: Clear transient Vision target registry credential facts
      ansible.builtin.set_fact:
        eva_vision_registry_config_raw: {}
        eva_vision_registry_config: {}
        eva_vision_model_auth: {}
        eva_vision_model_username: ''
        eva_vision_model_password: ''
        eva_vision_model_existing: {}
        eva_vision_model_desired_data: {}
