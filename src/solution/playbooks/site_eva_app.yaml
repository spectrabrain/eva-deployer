# site_eva_app.yaml
#
# eva-app 만 배포합니다. site_eva.yaml 은 eva_agent → eva_vision → eva_app 묶음이라
# app 만 다시 올리려면 agent/vision 까지 같이 돌았습니다. eva_app role 은
# config/<host>/eva.yaml 의 App generated values를 읽으므로 CLI의 App plan은 Config를
# 내부 선행 단계로 포함합니다.
#
#   .venv/bin/ansible-playbook \
#     -i workspace/inventory/hosts.ini \
#     src/solution/playbooks/site_eva_app.yaml
#
#   # airgap
#   .venv/bin/ansible-playbook \
#     -i workspace/inventory/hosts.ini \
#     src/solution/playbooks/site_eva_app.yaml \
#     -e repository_mode=local_repository -e repository_registry=localhost:32080
#
#   # 중앙 IAM을 쓰는 App-only 설치는 workspace/site-values/app.yaml에
#   # app.sso.baseUrl과 app.sso.adminClientSecret을 명시합니다.
#
- name: Deploy EVA App
  hosts: all
  become: true
  any_errors_fatal: true
  serial: 1
  vars_files:
    - ../../playbook-vars.yaml

  pre_tasks:
    - name: Load shared EVA playbook context
      ansible.builtin.import_tasks: ../../playbook-preflight.yaml

    - name: Resolve repository mode
      ansible.builtin.set_fact:
        repository_mode: "{{ repository_mode | default('cloud_repository') }}"
      changed_when: false

  tasks:
    - name: STEP 1 - eva-app
      ansible.builtin.import_role:
        name: eva_app
