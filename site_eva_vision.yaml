# site_eva_vision.yaml
- name: Configure EVA Vision
  hosts: all
  become: true
  any_errors_fatal: true
  serial: 1
  vars_files:
    - "{{ playbook_dir }}/versions.json"

  pre_tasks:
    - name: Resolve repository mode
      ansible.builtin.set_fact:
        repository_mode: "{{ repository_mode | default('cloud_repository') }}"
        airgap_mode: "{{ (airgap_mode | default(false) | bool) or ((repository_mode | default('cloud_repository')) in ['remote_repository', 'local_repository']) }}"
      changed_when: false

    - name: Resolve eva.yaml config host
      ansible.builtin.set_fact:
        eva_vision_config_host: "{{ eva_vision_config_host | default(ansible_host | default(inventory_hostname)) }}"
      changed_when: false

    - name: Resolve eva.yaml path generated by site_eva_config
      ansible.builtin.set_fact:
        eva_vision_generated_config_path: "{{ playbook_dir }}/config/{{ eva_vision_config_host }}/eva.yaml"
      changed_when: false

    - name: Check eva.yaml exists on control node
      ansible.builtin.stat:
        path: "{{ eva_vision_generated_config_path }}"
      register: eva_vision_generated_config_stat
      delegate_to: localhost
      become: false

    - name: Ensure eva.yaml exists before eva_vision install
      ansible.builtin.assert:
        that:
          - eva_vision_generated_config_stat.stat.exists
        fail_msg: >-
          {{ eva_vision_generated_config_path }} 파일이 없습니다.
          먼저 site_eva_config.yaml을 실행해 eva.yaml을 생성하세요.

    - name: Load eva.yaml generated config
      ansible.builtin.include_vars:
        file: "{{ eva_vision_generated_config_path }}"
        name: eva_vision_generated_config

    - name: Apply eva.yaml MIG settings for eva_vision
      ansible.builtin.set_fact:
        eva_vision_mig_enabled_from_config: "{{ eva_vision_generated_config.mig_enabled | default(false) | bool }}"
      changed_when: false

  tasks:
    - name: STEP 1 - eva-vision
      ansible.builtin.import_role:
        name: eva_vision
