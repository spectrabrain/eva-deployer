- name: Set EVA Agent dependency defaults
  ansible.builtin.set_fact:
    repository_mode: "{{ repository_mode | default('cloud_repository') }}"
    repository_project: "{{ repository_project | default('eva') }}"
    repository_registry: >-
      {{
        repository_registry
        | default(harbor_registry | default(((repository_mode | default('cloud_repository')) == 'local_repository') | ternary('localhost:32080', '')))
        | regex_replace('^https?://', '')
        | regex_replace('/+$', '')
      }}
    airgap_mode: "{{ (airgap_mode | default(false) | bool) or ((repository_mode | default('cloud_repository')) in ['remote_repository', 'local_repository']) }}"
    eva_agent_namespace: "{{ eva_agent_namespace | default('eva-agent') }}"
    eva_agent_deploy_version: "{{ eva_agent_deploy_version | mandatory }}"
    eva_agent_workdir: "{{ eva_agent_workdir | default('/opt/eva-agent/' ~ eva_agent_deploy_version) }}"
    eva_agent_qdrant_deploy_values_dir: "{{ eva_agent_qdrant_deploy_values_dir | default((eva_deploy_root | default(playbook_dir ~ '/deploy')) ~ '/' ~ (ansible_host | default(inventory_hostname)) ~ '/qdrant') }}"
    eva_agent_vllm_deploy_values_dir: "{{ eva_agent_vllm_deploy_values_dir | default((eva_deploy_root | default(playbook_dir ~ '/deploy')) ~ '/' ~ (ansible_host | default(inventory_hostname)) ~ '/vllm') }}"
    eva_agent_kubeconfig: "{{ eva_agent_kubeconfig | default(ansible_facts['env']['HOME'] ~ '/.kube/config') }}"
    eva_agent_install_root: "{{ eva_agent_install_root | default(playbook_dir ~ '/install') }}"
    eva_agent_aws_profile: "{{ eva_agent_aws_profile | default('default') }}"
    eva_agent_sync_aws_credentials: "{{ eva_agent_sync_aws_credentials | default((not ((airgap_mode | default(false) | bool) or ((repository_mode | default('cloud_repository')) in ['remote_repository', 'local_repository']))) | ternary(1, 0)) }}"
    eva_agent_qdrant_chart_version: "{{ eva_agent_qdrant_chart_version | default(qdrant_chart_version) | mandatory }}"
    eva_agent_vllm_chart_version: "{{ eva_agent_vllm_chart_version | mandatory }}"
    eva_agent_vllm_profile: "{{ eva_agent_vllm_profile | default('PRO6000-MIGx4') }}"
    eva_agent_vllm_values_file: "{{ eva_agent_vllm_values_file | default('values-k3s.' ~ (eva_agent_vllm_profile | default('PRO6000-MIGx4')) ~ '.yaml') }}"
    eva_agent_vllm_engine_deployment_name: "{{ eva_agent_vllm_engine_deployment_name | default('eva-agent-vllm-qwen35-vl-9b-fp8-deployment-vllm') }}"
    eva_agent_chartmuseum_base_url: >-
      {{ eva_agent_chartmuseum_base_url
         | default('https://raw.githubusercontent.com/mellerikat/eva-agent/chartmuseum/release/' ~ eva_agent_deploy_version) }}
    eva_agent_offline_dir: "{{ eva_agent_offline_dir | default((eva_agent_install_root | default(playbook_dir ~ '/install')) ~ '/eva-agent') }}"
    eva_agent_offline_release_dir: "{{ eva_agent_offline_release_dir | default((eva_agent_offline_dir | default((eva_agent_install_root | default(playbook_dir ~ '/install')) ~ '/eva-agent')) ~ '/release/' ~ eva_agent_deploy_version) }}"
    eva_agent_offline_qdrant_chart_tgz: "{{ eva_agent_offline_qdrant_chart_tgz | default((eva_agent_install_root | default(playbook_dir ~ '/install')) ~ '/qdrant/qdrant-' ~ (eva_agent_qdrant_chart_version | default(qdrant_chart_version)) ~ '.tgz') }}"
    eva_agent_offline_vllm_chart_tgz: "{{ eva_agent_offline_vllm_chart_tgz | default((eva_agent_offline_dir | default((eva_agent_install_root | default(playbook_dir ~ '/install')) ~ '/eva-agent')) ~ '/eva-agent-vllm-' ~ eva_agent_vllm_chart_version ~ '.tgz') }}"
    eva_agent_offline_init_chart_tgz: "{{ eva_agent_offline_init_chart_tgz | default((eva_agent_offline_dir | default((eva_agent_install_root | default(playbook_dir ~ '/install')) ~ '/eva-agent')) ~ '/eva-agent-init-1.0.0.tgz') }}"
    eva_agent_offline_kustomize_bin: "{{ eva_agent_offline_kustomize_bin | default((eva_agent_install_root | default(playbook_dir ~ '/install')) ~ '/tools/kustomize') }}"
    eva_agent_offline_models_dir: "{{ eva_agent_offline_models_dir | default((eva_agent_install_root | default(playbook_dir ~ '/install')) ~ '/models') }}"
    eva_agent_offline_agent_model_dir: "{{ eva_agent_offline_agent_model_dir | default((eva_agent_offline_models_dir | default((eva_agent_install_root | default(playbook_dir ~ '/install')) ~ '/models')) ~ '/agent/hf') }}"
    eva_agent_offline_vllm_model_dir: "{{ eva_agent_offline_vllm_model_dir | default((eva_agent_offline_models_dir | default((eva_agent_install_root | default(playbook_dir ~ '/install')) ~ '/models')) ~ '/vllm/hf') }}"
    eva_agent_qdrant_statefulset_name: "{{ eva_agent_qdrant_statefulset_name | default('eva-agent-qdrant') }}"
    eva_agent_qdrant_snapshots_volume_name: "{{ eva_agent_qdrant_snapshots_volume_name | default('eva-agent-qdrant-snapshots') }}"
    eva_agent_qdrant_snapshot_pv_size: "{{ eva_agent_qdrant_snapshot_pv_size | default('10Gi') }}"
    eva_agent_qdrant_offline_snapshot_dir: "{{ eva_agent_qdrant_offline_snapshot_dir | default((eva_agent_install_root | default(playbook_dir ~ '/install')) ~ '/qdrant-snapshots') }}"
    eva_agent_qdrant_snapshot_pvc_name: "{{ eva_agent_qdrant_snapshot_pvc_name | default(eva_agent_qdrant_snapshots_volume_name ~ '-' ~ eva_agent_qdrant_statefulset_name ~ '-0') }}"

- name: Validate repository mode for EVA Agent dependencies
  ansible.builtin.assert:
    that:
      - repository_mode in ['cloud_repository', 'remote_repository', 'local_repository']
      - repository_mode == 'cloud_repository' or repository_registry | length > 0
    fail_msg: >-
      repository_mode은 cloud_repository, remote_repository, local_repository 중 하나여야 합니다.
      remote_repository/local_repository 모드에서는 repository_registry 또는 harbor_registry가 필요합니다.

- name: Resolve EVA Agent dependency image repositories
  ansible.builtin.set_fact:
    eva_agent_qdrant_image_repository: >-
      {{
        eva_agent_qdrant_image_repository | default(
          (repository_mode == 'cloud_repository')
          | ternary('docker.io/qdrant/qdrant', repository_registry ~ '/' ~ repository_project ~ '/qdrant')
        )
      }}
    eva_agent_qdrant_image_tag: "{{ eva_agent_qdrant_image_tag | default('v' ~ eva_agent_qdrant_chart_version) }}"
    eva_agent_vllm_image_repository: >-
      {{
        eva_agent_vllm_image_repository | default(
          (repository_mode == 'cloud_repository')
          | ternary('vllm/vllm-openai', repository_registry ~ '/' ~ repository_project ~ '/vllm-openai')
        )
      }}
    eva_agent_vllm_image_tag: "{{ eva_agent_vllm_image_tag | default('v0.21.0') }}"
    eva_agent_vllm_router_image_repository: >-
      {{
        eva_agent_vllm_router_image_repository | default(
          (repository_mode == 'cloud_repository')
          | ternary('lmcache/lmstack-router', repository_registry ~ '/' ~ repository_project ~ '/lmstack-router')
        )
      }}
    eva_agent_vllm_router_image_tag: "{{ eva_agent_vllm_router_image_tag | default('v0.1.10') }}"

- name: Detect local disk mount candidates from facts
  ansible.builtin.set_fact:
    eva_agent_supported_vllm_profiles:
      - A6000x1
      - L40sx1
      - PRO5000x3
      - PRO6000-MIGx4
    eva_agent_local_mount_candidates: >-
      {{
        ansible_facts.mounts
        | selectattr('device', 'match', '^/dev/')
        | rejectattr('fstype', 'in', ['tmpfs', 'devtmpfs', 'overlay', 'squashfs', 'nfs', 'nfs4', 'cifs'])
        | rejectattr('fstype', 'in', ['fuse', 'fuse.sshfs'])
        | rejectattr('fstype', 'match', '^fuse\\.')
        | list
      }}

- name: Validate selected EVA Agent vLLM profile
  ansible.builtin.assert:
    that:
      - eva_agent_vllm_profile in eva_agent_supported_vllm_profiles
    fail_msg: >-
      지원하지 않는 eva_agent_vllm_profile={{ eva_agent_vllm_profile }} 입니다.
      사용 가능 값: {{ eva_agent_supported_vllm_profiles | join(', ') }}

- name: Ensure local disk mount candidate exists
  ansible.builtin.assert:
    that:
      - eva_agent_local_mount_candidates | length > 0
    fail_msg: "로컬 디스크 마운트 후보를 찾지 못했습니다."

- name: Detect largest local disk mount from facts
  ansible.builtin.set_fact:
    eva_agent_largest_local_mount: >-
      {{ (eva_agent_local_mount_candidates | sort(attribute='size_total', reverse=true) | first).mount }}

- name: Set NFS share path from largest local disk mount
  ansible.builtin.set_fact:
    eva_agent_nfs_share_path: >-
      {{ eva_agent_nfs_share_path
         | default((eva_agent_largest_local_mount | regex_replace('/+$', '')) ~ '/share/eva-agent') }}

- name: Detect existing vLLM shared PV NFS path
  ansible.builtin.command: >-
    kubectl get pv eva-agent-vllm-shared-pvc-storage -o jsonpath='{.spec.nfs.path}'
  register: eva_agent_vllm_pv_path
  changed_when: false
  failed_when: false
  when: not ansible_check_mode
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Reuse existing vLLM PV base path when present
  ansible.builtin.set_fact:
    eva_agent_nfs_share_path: "{{ eva_agent_vllm_pv_path.stdout | regex_replace('/vllm-cache$', '') }}"
  when:
    - not ansible_check_mode
    - eva_agent_vllm_pv_path.rc == 0
    - eva_agent_vllm_pv_path.stdout | length > 0

- name: Ensure NFS share and cache directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0775'
  loop:
    - "{{ eva_agent_nfs_share_path }}"
    - "{{ eva_agent_nfs_share_path }}/agent-cache"
    - "{{ eva_agent_nfs_share_path }}/agent-cache/hf"
    - "{{ eva_agent_nfs_share_path }}/vllm-cache"
  when: not ansible_check_mode

- name: Check offline EVA model directories for airgap
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ eva_agent_offline_agent_model_dir }}"
    - "{{ eva_agent_offline_vllm_model_dir }}"
  register: eva_agent_offline_model_dir_stats
  when:
    - airgap_mode | default(false) | bool
    - not ansible_check_mode

- name: Assert offline EVA model directories exist for airgap
  ansible.builtin.assert:
    that:
      - (eva_agent_offline_model_dir_stats.results | selectattr('stat.exists', 'equalto', true) | list | length) == 2
    fail_msg: >-
      airgap_mode=true 인 경우 모델 캐시가 필요합니다.
      먼저 ./install/download_eva_models.sh 실행 후
      {{ eva_agent_offline_agent_model_dir }} 와 {{ eva_agent_offline_vllm_model_dir }} 경로를 준비하세요.
  when:
    - airgap_mode | default(false) | bool
    - not ansible_check_mode

- name: Check EVA agent model cache sync marker
  ansible.builtin.stat:
    path: "{{ eva_agent_nfs_share_path }}/agent-cache/hf/.offline_sync_done"
  register: eva_agent_agent_cache_sync_marker
  when:
    - airgap_mode | default(false) | bool
    - not ansible_check_mode

- name: Copy offline EVA agent model cache into NFS share
  ansible.builtin.shell: >-
    set -euo pipefail &&
    cp -a "{{ eva_agent_offline_agent_model_dir }}/." "{{ eva_agent_nfs_share_path }}/agent-cache/hf/"
  args:
    executable: /bin/bash
  when:
    - airgap_mode | default(false) | bool
    - not ansible_check_mode
    - not eva_agent_agent_cache_sync_marker.stat.exists

- name: Mark EVA agent model cache sync complete
  ansible.builtin.file:
    path: "{{ eva_agent_nfs_share_path }}/agent-cache/hf/.offline_sync_done"
    state: touch
    mode: '0644'
  when:
    - airgap_mode | default(false) | bool
    - not ansible_check_mode
    - not eva_agent_agent_cache_sync_marker.stat.exists

- name: Restore Hugging Face symlinks for EVA agent cache when script exists
  ansible.builtin.shell: >-
    if [ -f "{{ eva_agent_nfs_share_path }}/agent-cache/hf/.restore_hf_symlinks.sh" ]; then
      sh "{{ eva_agent_nfs_share_path }}/agent-cache/hf/.restore_hf_symlinks.sh" "{{ eva_agent_nfs_share_path }}/agent-cache/hf";
    fi
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - airgap_mode | default(false) | bool
    - not ansible_check_mode

- name: Check EVA vLLM model cache sync marker
  ansible.builtin.stat:
    path: "{{ eva_agent_nfs_share_path }}/vllm-cache/.offline_sync_done"
  register: eva_agent_vllm_cache_sync_marker
  when:
    - airgap_mode | default(false) | bool
    - not ansible_check_mode

- name: Copy offline EVA vLLM model cache into NFS share
  ansible.builtin.shell: >-
    set -euo pipefail &&
    cp -a "{{ eva_agent_offline_vllm_model_dir }}/." "{{ eva_agent_nfs_share_path }}/vllm-cache/"
  args:
    executable: /bin/bash
  when:
    - airgap_mode | default(false) | bool
    - not ansible_check_mode
    - not eva_agent_vllm_cache_sync_marker.stat.exists

- name: Mark EVA vLLM model cache sync complete
  ansible.builtin.file:
    path: "{{ eva_agent_nfs_share_path }}/vllm-cache/.offline_sync_done"
    state: touch
    mode: '0644'
  when:
    - airgap_mode | default(false) | bool
    - not ansible_check_mode
    - not eva_agent_vllm_cache_sync_marker.stat.exists

- name: Restore Hugging Face symlinks for vLLM cache when script exists
  ansible.builtin.shell: >-
    if [ -f "{{ eva_agent_nfs_share_path }}/vllm-cache/.restore_hf_symlinks.sh" ]; then
      sh "{{ eva_agent_nfs_share_path }}/vllm-cache/.restore_hf_symlinks.sh" "{{ eva_agent_nfs_share_path }}/vllm-cache";
    fi
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - airgap_mode | default(false) | bool
    - not ansible_check_mode

- name: Set ownership and permissions for NFS share path
  ansible.builtin.file:
    path: "{{ eva_agent_nfs_share_path }}"
    owner: "10001"
    group: "10001"
    mode: '0775'
    recurse: true
  when: not ansible_check_mode

- name: Allow localhost-only NFS export for EVA Agent share (cleanup old entry)
  ansible.builtin.lineinfile:
    path: /etc/exports
    regexp: '^.*/share/eva-agent 127\.0\.0\.1\(rw,sync,no_subtree_check,root_squash,anonuid=10001,anongid=10001\)$'
    state: absent
  when: not ansible_check_mode

- name: Configure localhost-only NFS export for EVA Agent share
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: "{{ eva_agent_nfs_share_path }} 127.0.0.1(rw,sync,no_subtree_check,root_squash,anonuid=10001,anongid=10001)"
    create: true
    mode: '0644'
  register: eva_agent_exports_line
  when: not ansible_check_mode

- name: Reload NFS exports
  ansible.builtin.command: exportfs -ra
  changed_when: eva_agent_exports_line.changed
  when: not ansible_check_mode

- name: Ensure NFS services are available
  ansible.builtin.shell: |
    set -euo pipefail
    systemctl start rpcbind nfs-mountd nfs-idmapd
    if [ ! -r /proc/fs/nfsd/threads ] || [ "$(cat /proc/fs/nfsd/threads)" = "0" ]; then
      rpc.nfsd 1
    fi
    exportfs -ra
  args:
    executable: /bin/bash
  changed_when: false
  when: not ansible_check_mode

- name: Show NFS exports on localhost
  ansible.builtin.command: showmount -e localhost
  register: eva_agent_showmount
  changed_when: false
  when: not ansible_check_mode

- name: Ensure temporary NFS test mount directory exists
  ansible.builtin.file:
    path: /mnt/tmp
    state: directory
    mode: '0755'
  when: not ansible_check_mode

- name: Mount NFS share for validation
  ansible.posix.mount:
    path: /mnt/tmp
    src: "localhost:{{ eva_agent_nfs_share_path }}"
    fstype: nfs
    opts: rw,nfsvers=4
    state: mounted
  when: not ansible_check_mode

- name: Unmount NFS validation mount
  ansible.posix.mount:
    path: /mnt/tmp
    state: unmounted
  when: not ansible_check_mode

- name: Check kustomize binary
  ansible.builtin.stat:
    path: /usr/local/bin/kustomize
  register: kustomize_binary

- name: Install kustomize from internet when missing
  ansible.builtin.shell: |
    set -euo pipefail
    cd /tmp
    curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
    install -m 0755 kustomize /usr/local/bin/kustomize
    rm -f /tmp/kustomize
  args:
    executable: /bin/bash
  changed_when: true
  when:
    - not kustomize_binary.stat.exists
    - not (airgap_mode | default(false) | bool)

- name: Install kustomize from offline bundle when missing
  ansible.builtin.copy:
    src: "{{ eva_agent_offline_kustomize_bin }}"
    dest: /usr/local/bin/kustomize
    mode: '0755'
    remote_src: true
  when:
    - not kustomize_binary.stat.exists
    - airgap_mode | default(false) | bool

- name: Remove EVA dependency workspace if it exists
  ansible.builtin.file:
    path: "{{ eva_agent_workdir }}"
    state: absent

- name: Ensure EVA dependency workspace exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ eva_agent_workdir }}"
    - "{{ eva_agent_workdir }}/eva-agent-init"
    - "{{ eva_agent_workdir }}/eva-agent-qdrant"
    - "{{ eva_agent_workdir }}/eva-agent-vllm"
    - "{{ eva_agent_workdir }}/plugin/eva-agent-qdrant"

- name: Ensure EVA dependency deploy values directories exist on control node
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ eva_agent_qdrant_deploy_values_dir }}"
    - "{{ eva_agent_vllm_deploy_values_dir }}"
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

- name: Add Helm repository for Qdrant
  ansible.builtin.command: helm repo add qdrant https://qdrant.github.io/qdrant-helm
  register: helm_repo_qdrant
  changed_when: "'already exists' not in (helm_repo_qdrant.stdout + helm_repo_qdrant.stderr)"
  failed_when:
    - helm_repo_qdrant.rc != 0
    - "'already exists' not in (helm_repo_qdrant.stdout + helm_repo_qdrant.stderr)"
  when: not (airgap_mode | default(false) | bool)
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Add Helm repository for EVA Agent
  ansible.builtin.command: helm repo add eva-agent https://mellerikat.github.io/eva-agent
  register: helm_repo_eva_agent
  changed_when: "'already exists' not in (helm_repo_eva_agent.stdout + helm_repo_eva_agent.stderr)"
  failed_when:
    - helm_repo_eva_agent.rc != 0
    - "'already exists' not in (helm_repo_eva_agent.stdout + helm_repo_eva_agent.stderr)"
  when: not (airgap_mode | default(false) | bool)
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Update Helm repositories
  ansible.builtin.command: helm repo update
  changed_when: true
  when: not (airgap_mode | default(false) | bool)
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Download eva-agent-init values from chartmuseum release
  ansible.builtin.get_url:
    url: "{{ eva_agent_chartmuseum_base_url }}/eva-agent-init/values-k3s.yaml"
    dest: "{{ eva_agent_workdir }}/eva-agent-init/values-k3s.yaml"
    mode: '0644'
  when:
    - not ansible_check_mode
    - not (airgap_mode | default(false) | bool)

- name: Download eva-agent-qdrant environment values from chartmuseum release
  ansible.builtin.get_url:
    url: "{{ eva_agent_chartmuseum_base_url }}/eva-agent-qdrant/values-k3s.yaml"
    dest: "{{ eva_agent_workdir }}/eva-agent-qdrant/values-k3s.yaml"
    mode: '0644'
  when:
    - not ansible_check_mode
    - not (airgap_mode | default(false) | bool)

- name: Download eva-agent-vllm values from chartmuseum release
  ansible.builtin.get_url:
    url: "{{ eva_agent_chartmuseum_base_url }}/eva-agent-vllm/{{ eva_agent_vllm_values_file }}"
    dest: "{{ eva_agent_workdir }}/eva-agent-vllm/{{ eva_agent_vllm_values_file }}"
    mode: '0644'
  when:
    - not ansible_check_mode
    - not (airgap_mode | default(false) | bool)

- name: Download Qdrant post-renderer script from chartmuseum release
  ansible.builtin.get_url:
    url: "{{ eva_agent_chartmuseum_base_url }}/plugins/eva-agent-qdrant/post-renderer.sh"
    dest: "{{ eva_agent_workdir }}/plugin/eva-agent-qdrant/post-renderer.sh"
    mode: '0755'
  when:
    - not ansible_check_mode
    - not (airgap_mode | default(false) | bool)

- name: Download Qdrant plugin metadata from chartmuseum release
  ansible.builtin.get_url:
    url: "{{ eva_agent_chartmuseum_base_url }}/plugins/eva-agent-qdrant/plugin.yaml"
    dest: "{{ eva_agent_workdir }}/plugin/eva-agent-qdrant/plugin.yaml"
    mode: '0644'
  when:
    - not ansible_check_mode
    - not (airgap_mode | default(false) | bool)

- name: Copy eva-agent-init values from offline bundle
  ansible.builtin.copy:
    src: "{{ eva_agent_offline_release_dir }}/eva-agent-init/values-k3s.yaml"
    dest: "{{ eva_agent_workdir }}/eva-agent-init/values-k3s.yaml"
    mode: '0644'
    remote_src: true
  when:
    - not ansible_check_mode
    - airgap_mode | default(false) | bool

- name: Copy eva-agent-qdrant values from offline bundle
  ansible.builtin.copy:
    src: "{{ eva_agent_offline_release_dir }}/eva-agent-qdrant/values-k3s.yaml"
    dest: "{{ eva_agent_workdir }}/eva-agent-qdrant/values-k3s.yaml"
    mode: '0644'
    remote_src: true
  when:
    - not ansible_check_mode
    - airgap_mode | default(false) | bool

- name: Copy eva-agent-vllm values from offline bundle
  ansible.builtin.copy:
    src: "{{ eva_agent_offline_release_dir }}/eva-agent-vllm/{{ eva_agent_vllm_values_file }}"
    dest: "{{ eva_agent_workdir }}/eva-agent-vllm/{{ eva_agent_vllm_values_file }}"
    mode: '0644'
    remote_src: true
  when:
    - not ansible_check_mode
    - airgap_mode | default(false) | bool

- name: Copy Qdrant post-renderer script from offline bundle
  ansible.builtin.copy:
    src: "{{ eva_agent_offline_release_dir }}/plugins/eva-agent-qdrant/post-renderer.sh"
    dest: "{{ eva_agent_workdir }}/plugin/eva-agent-qdrant/post-renderer.sh"
    mode: '0755'
    remote_src: true
  when:
    - not ansible_check_mode
    - airgap_mode | default(false) | bool

- name: Copy Qdrant plugin metadata from offline bundle
  ansible.builtin.copy:
    src: "{{ eva_agent_offline_release_dir }}/plugins/eva-agent-qdrant/plugin.yaml"
    dest: "{{ eva_agent_workdir }}/plugin/eva-agent-qdrant/plugin.yaml"
    mode: '0644'
    remote_src: true
  when:
    - not ansible_check_mode
    - airgap_mode | default(false) | bool

- name: Ensure Qdrant post-renderer executable bit
  ansible.builtin.file:
    path: "{{ eva_agent_workdir }}/plugin/eva-agent-qdrant/post-renderer.sh"
    mode: '0755'

- name: Load eva-agent-qdrant chart values
  ansible.builtin.slurp:
    src: "{{ eva_agent_workdir }}/eva-agent-qdrant/values-k3s.yaml"
  register: eva_agent_qdrant_values_raw
  when: not ansible_check_mode

- name: Parse Qdrant snapshot sync specs (SNAPSHOT_SPECS)
  ansible.builtin.set_fact:
    eva_agent_qdrant_snapshot_spec_raw: >-
      {{
        (eva_agent_qdrant_values_raw.content | b64decode | from_yaml).sidecarContainers
        | selectattr('name', 'equalto', 'qdrant-snapshot-sync')
        | map(attribute='env') | first
        | selectattr('name', 'equalto', 'SNAPSHOT_SPECS')
        | map(attribute='value') | first
        | trim
      }}
  when: not ansible_check_mode

- name: Split Qdrant snapshot sync specs into lines
  ansible.builtin.set_fact:
    eva_agent_qdrant_snapshot_spec_lines: >-
      {{
        eva_agent_qdrant_snapshot_spec_raw.split('\n')
        | map('trim') | reject('equalto', '') | reject('match', '^#')
        | list
      }}
  when: not ansible_check_mode

- name: Check offline Qdrant snapshot files for airgap
  ansible.builtin.stat:
    path: "{{ eva_agent_qdrant_offline_snapshot_dir }}/{{ item.split('|')[1] }}"
  loop: "{{ eva_agent_qdrant_snapshot_spec_lines }}"
  register: eva_agent_qdrant_offline_snapshot_stats
  when:
    - airgap_mode | default(false) | bool
    - not ansible_check_mode

- name: Assert offline Qdrant snapshot files exist for airgap
  ansible.builtin.assert:
    that:
      - (eva_agent_qdrant_offline_snapshot_stats.results | selectattr('stat.exists', 'equalto', true) | list | length) == (eva_agent_qdrant_snapshot_spec_lines | length)
    fail_msg: >-
      airgap_mode=true 인 경우 Qdrant snapshot 파일이 필요합니다.
      먼저 ./install/download_qdrant_snapshots.sh 실행 후
      {{ eva_agent_qdrant_offline_snapshot_dir }} 경로를 준비하세요.
  when:
    - airgap_mode | default(false) | bool
    - not ansible_check_mode

- name: Blank SNAPSHOT_SPECS s3Directory for airgap Qdrant snapshot sidecar
  ansible.builtin.replace:
    path: "{{ eva_agent_workdir }}/eva-agent-qdrant/values-k3s.yaml"
    regexp: "{{ item.split('|')[0] | regex_escape }}\\|{{ item.split('|')[1] | regex_escape }}\\|"
    replace: "|{{ item.split('|')[1] }}|"
  loop: "{{ eva_agent_qdrant_snapshot_spec_lines }}"
  when:
    - not ansible_check_mode
    - airgap_mode | default(false) | bool

- name: Check existing Qdrant snapshot PVC
  ansible.builtin.command: >-
    kubectl get pvc {{ eva_agent_qdrant_snapshot_pvc_name }} -n {{ eva_agent_namespace }}
  register: eva_agent_qdrant_snapshot_pvc_check
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - airgap_mode | default(false) | bool
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Detect k3s node name for Qdrant snapshot PV pre-seed
  ansible.builtin.command: kubectl get nodes -o jsonpath='{.items[*].metadata.name}'
  register: eva_agent_qdrant_snapshot_nodes
  changed_when: false
  when:
    - not ansible_check_mode
    - airgap_mode | default(false) | bool
    - eva_agent_qdrant_snapshot_pvc_check.rc != 0
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Ensure single-node cluster for Qdrant snapshot PV pre-seed
  ansible.builtin.assert:
    that:
      - (eva_agent_qdrant_snapshot_nodes.stdout | trim).split() | length == 1
    fail_msg: >-
      Qdrant snapshot 오프라인 사전 시딩은 단일 노드 클러스터만 지원합니다.
      현재 노드: {{ eva_agent_qdrant_snapshot_nodes.stdout }}
  when:
    - not ansible_check_mode
    - airgap_mode | default(false) | bool
    - eva_agent_qdrant_snapshot_pvc_check.rc != 0

- name: Set Qdrant snapshot PV pre-seed facts
  ansible.builtin.set_fact:
    eva_agent_qdrant_snapshot_pv_node: "{{ (eva_agent_qdrant_snapshot_nodes.stdout | trim).split()[0] }}"
    eva_agent_qdrant_snapshot_pv_hostpath: "{{ (eva_agent_largest_local_mount | regex_replace('/+$', '')) ~ '/local/eva-agent-qdrant-snapshots-bootstrap' }}"
  when:
    - not ansible_check_mode
    - airgap_mode | default(false) | bool
    - eva_agent_qdrant_snapshot_pvc_check.rc != 0

- name: Ensure Qdrant snapshot PV hostPath directory exists
  ansible.builtin.file:
    path: "{{ eva_agent_qdrant_snapshot_pv_hostpath }}/bootstrap"
    state: directory
    mode: '0775'
  when:
    - not ansible_check_mode
    - airgap_mode | default(false) | bool
    - eva_agent_qdrant_snapshot_pvc_check.rc != 0

- name: Copy offline Qdrant snapshot files into hostPath directory
  ansible.builtin.copy:
    src: "{{ eva_agent_qdrant_offline_snapshot_dir }}/{{ item.split('|')[1] }}"
    dest: "{{ eva_agent_qdrant_snapshot_pv_hostpath }}/bootstrap/{{ item.split('|')[1] }}"
    mode: '0644'
    remote_src: true
  loop: "{{ eva_agent_qdrant_snapshot_spec_lines }}"
  when:
    - not ansible_check_mode
    - airgap_mode | default(false) | bool
    - eva_agent_qdrant_snapshot_pvc_check.rc != 0

- name: Render Qdrant snapshot bootstrap PV manifest on control node
  ansible.builtin.template:
    src: "{{ playbook_dir }}/values/qdrant-snapshot-pv.yaml.j2"
    dest: "{{ eva_agent_qdrant_deploy_values_dir }}/qdrant-snapshot-pv.yaml"
    mode: "0644"
  delegate_to: localhost
  become: false
  when:
    - not ansible_check_mode
    - airgap_mode | default(false) | bool
    - eva_agent_qdrant_snapshot_pvc_check.rc != 0

- name: Copy Qdrant snapshot bootstrap PV manifest to remote workspace
  ansible.builtin.copy:
    src: "{{ eva_agent_qdrant_deploy_values_dir }}/qdrant-snapshot-pv.yaml"
    dest: "{{ eva_agent_workdir }}/eva-agent-qdrant/snapshot-bootstrap-pv.yaml"
    mode: "0644"
  when:
    - not ansible_check_mode
    - airgap_mode | default(false) | bool
    - eva_agent_qdrant_snapshot_pvc_check.rc != 0

- name: Apply Qdrant snapshot bootstrap PV
  ansible.builtin.command: >-
    kubectl apply -f {{ eva_agent_workdir }}/eva-agent-qdrant/snapshot-bootstrap-pv.yaml
  changed_when: true
  when:
    - not ansible_check_mode
    - airgap_mode | default(false) | bool
    - eva_agent_qdrant_snapshot_pvc_check.rc != 0
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Detect Helm version
  ansible.builtin.command: helm version --short
  register: eva_agent_helm_version
  changed_when: false

- name: Set Qdrant post-renderer argument for current Helm major
  ansible.builtin.set_fact:
    eva_agent_qdrant_post_renderer_arg: >-
      {{
        '--post-renderer eva-agent-qdrant-postrenderer'
        if (eva_agent_helm_version.stdout is search('^v4'))
        else '--post-renderer ' ~ eva_agent_workdir ~ '/plugin/eva-agent-qdrant/post-renderer.sh'
      }}

- name: Align NFS share path in eva-agent-init values
  ansible.builtin.replace:
    path: "{{ eva_agent_workdir }}/eva-agent-init/values-k3s.yaml"
    regexp: '/data001/share/eva-agent'
    replace: "{{ eva_agent_nfs_share_path }}"
  when: not ansible_check_mode

- name: Set local-path provisioner in eva-agent-init values
  ansible.builtin.replace:
    path: "{{ eva_agent_workdir }}/eva-agent-init/values-k3s.yaml"
    regexp: 'provisioner: ""'
    replace: 'provisioner: "rancher.io/local-path"'
  when: not ansible_check_mode

- name: Write vLLM override values from generated config (eva.yaml)
  ansible.builtin.set_fact:
    eva_agent_vllm_values_override_sanitized: >-
      {{
        (
          eva_agent_vllm_values_override_from_config
          | dict2items
          | rejectattr('key', 'equalto', 'servingEngineSpec')
          | items2dict
        )
        | combine(
            {
              'servingEngineSpec': (
                eva_agent_vllm_values_override_from_config.servingEngineSpec
                | default({})
                | dict2items
                | rejectattr('key', 'equalto', 'modelSpec')
                | items2dict
              )
            }
          )
      }}
  when:
    - not ansible_check_mode
    - eva_agent_vllm_values_override_from_config is defined
    - (eva_agent_vllm_values_override_from_config | length) > 0

- name: Write vLLM override values from generated config (eva.yaml)
  ansible.builtin.copy:
    dest: "{{ eva_agent_vllm_deploy_values_dir }}/values-override-from-config.yaml"
    mode: "0644"
    content: "{{ eva_agent_vllm_values_override_sanitized | to_nice_yaml(indent=2, sort_keys=false) }}"
  delegate_to: localhost
  become: false
  when:
    - not ansible_check_mode
    - eva_agent_vllm_values_override_from_config is defined
    - (eva_agent_vllm_values_override_from_config | length) > 0

- name: Copy vLLM override values from generated config to remote workspace
  ansible.builtin.copy:
    src: "{{ eva_agent_vllm_deploy_values_dir }}/values-override-from-config.yaml"
    dest: "{{ eva_agent_workdir }}/eva-agent-vllm/values-override-from-config.yaml"
    mode: "0644"
  when:
    - not ansible_check_mode
    - eva_agent_vllm_values_override_from_config is defined
    - (eva_agent_vllm_values_override_from_config | length) > 0

- name: Remove stale vLLM config override values on control node
  ansible.builtin.file:
    path: "{{ eva_agent_vllm_deploy_values_dir }}/values-override-from-config.yaml"
    state: absent
  delegate_to: localhost
  become: false
  when:
    - not ansible_check_mode
    - (eva_agent_vllm_values_override_from_config | default({}) | length) == 0

- name: Remove stale vLLM config override values from remote workspace
  ansible.builtin.file:
    path: "{{ eva_agent_workdir }}/eva-agent-vllm/values-override-from-config.yaml"
    state: absent
  when:
    - not ansible_check_mode
    - (eva_agent_vllm_values_override_from_config | default({}) | length) == 0

- name: Warn when modelSpec override is ignored for compatibility
  ansible.builtin.debug:
    msg: >-
      eva.yaml vllm.servingEngineSpec.modelSpec override는 chart 스키마 충돌 방지를 위해 무시됩니다.
      (profile values의 modelSpec을 그대로 사용)
  when:
    - not ansible_check_mode
    - eva_agent_vllm_values_override_from_config is defined
    - eva_agent_vllm_values_override_from_config.servingEngineSpec is defined
    - eva_agent_vllm_values_override_from_config.servingEngineSpec.modelSpec is defined

- name: Load selected vLLM profile values
  ansible.builtin.slurp:
    src: "{{ eva_agent_workdir }}/eva-agent-vllm/{{ eva_agent_vllm_values_file }}"
  register: eva_agent_vllm_profile_values_raw
  when: not ansible_check_mode

- name: Parse selected vLLM profile values
  ansible.builtin.set_fact:
    eva_agent_vllm_profile_values: "{{ eva_agent_vllm_profile_values_raw.content | b64decode | from_yaml }}"
  when: not ansible_check_mode

- name: Resolve vLLM modelSpec override
  ansible.builtin.set_fact:
    eva_agent_vllm_first_model_override: >-
      {{
        (
          eva_agent_vllm_profile_values.servingEngineSpec.modelSpec[0]
          | dict2items
          | rejectattr('key', 'in', (airgap_mode | default(false) | bool) | ternary(['envFromSecret', 'initContainer'], []))
          | items2dict
        )
        | combine(
            {
              'repository': eva_agent_vllm_image_repository,
              'tag': eva_agent_vllm_image_tag
            },
            recursive=True
          )
      }}
  when: not ansible_check_mode

- name: Build vLLM k3s override values
  ansible.builtin.set_fact:
    eva_agent_vllm_k3s_override_values: >-
      {{
        eva_agent_vllm_profile_values
        | combine(
            {
              'routerSpec': (
                (eva_agent_vllm_profile_values.routerSpec | default({}))
                | combine(
                    {
                      'repository': eva_agent_vllm_router_image_repository,
                      'tag': eva_agent_vllm_router_image_tag,
                      'imagePullPolicy': 'IfNotPresent'
                    },
                    recursive=True
                  )
              ),
              'servingEngineSpec': (
                (eva_agent_vllm_profile_values.servingEngineSpec | default({}))
                | combine(
                    {
                      'modelSpec': [eva_agent_vllm_first_model_override] + (eva_agent_vllm_profile_values.servingEngineSpec.modelSpec[1:] | default([]))
                    },
                    recursive=True
                  )
              ),
              'sharedPvcStorage': (
                (eva_agent_vllm_profile_values.sharedPvcStorage | default({}))
                | combine(
                    {
                      'nfs': (
                        (eva_agent_vllm_profile_values.sharedPvcStorage.nfs | default({}))
                        | combine({'path': eva_agent_nfs_share_path ~ '/vllm-cache'}, recursive=True)
                      )
                    },
                    recursive=True
                  )
              )
            },
            recursive=True
          )
      }}
  when: not ansible_check_mode

- name: Render vLLM k3s override values on control node
  ansible.builtin.template:
    src: "{{ playbook_dir }}/values/vllm-k3s-override.yaml.j2"
    dest: "{{ eva_agent_vllm_deploy_values_dir }}/vllm-k3s-override.yaml"
    mode: "0644"
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

- name: Copy vLLM k3s override values to remote workspace
  ansible.builtin.copy:
    src: "{{ eva_agent_vllm_deploy_values_dir }}/vllm-k3s-override.yaml"
    dest: "{{ eva_agent_workdir }}/eva-agent-vllm/vllm-k3s-override.yaml"
    mode: "0644"
  when: not ansible_check_mode

- name: Render Qdrant k3s override values on control node
  ansible.builtin.template:
    src: "{{ playbook_dir }}/values/qdrant-k3s-override.yaml.j2"
    dest: "{{ eva_agent_qdrant_deploy_values_dir }}/qdrant-k3s-override.yaml"
    mode: "0644"
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

- name: Copy Qdrant k3s override values to remote workspace
  ansible.builtin.copy:
    src: "{{ eva_agent_qdrant_deploy_values_dir }}/qdrant-k3s-override.yaml"
    dest: "{{ eva_agent_workdir }}/eva-agent-qdrant/qdrant-k3s-override.yaml"
    mode: "0644"
  when: not ansible_check_mode

- name: Check existing charts for airgap mode
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ eva_agent_offline_qdrant_chart_tgz }}"
    - "{{ eva_agent_offline_vllm_chart_tgz }}"
    - "{{ eva_agent_offline_init_chart_tgz }}"
  register: eva_agent_offline_chart_stats
  when: airgap_mode | default(false) | bool

- name: Assert offline charts are prepared
  ansible.builtin.assert:
    that:
      - (eva_agent_offline_chart_stats.results | selectattr('stat.exists', 'equalto', true) | list | length) == 3
    fail_msg: >-
      airgap_mode=true 인 경우 아래 파일들이 필요합니다.
      {{ eva_agent_offline_qdrant_chart_tgz }}, {{ eva_agent_offline_vllm_chart_tgz }}, {{ eva_agent_offline_init_chart_tgz }}
      install/download_offline_assets.sh 를 먼저 실행하세요.
  when: airgap_mode | default(false) | bool

- name: Check eva-agent-init release
  ansible.builtin.command: helm status eva-agent-init -n {{ eva_agent_namespace }}
  register: eva_agent_init_status
  changed_when: false
  failed_when: false
  when: not ansible_check_mode
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Install eva-agent-init from online Helm repo
  ansible.builtin.command: >-
    helm upgrade --install eva-agent-init eva-agent/eva-agent-init
    --version 1.0.0
    --namespace {{ eva_agent_namespace }}
    --create-namespace
    --values {{ eva_agent_workdir }}/eva-agent-init/values-k3s.yaml
  when:
    - not ansible_check_mode
    - not (airgap_mode | default(false) | bool)
    - "eva_agent_init_status.rc != 0 or 'STATUS: failed' in eva_agent_init_status.stdout"
  changed_when: true
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Install eva-agent-init from offline chart
  ansible.builtin.command: >-
    helm upgrade --install eva-agent-init {{ eva_agent_offline_init_chart_tgz }}
    --namespace {{ eva_agent_namespace }}
    --create-namespace
    --values {{ eva_agent_workdir }}/eva-agent-init/values-k3s.yaml
  when:
    - not ansible_check_mode
    - airgap_mode | default(false) | bool
    - "eva_agent_init_status.rc != 0 or 'STATUS: failed' in eva_agent_init_status.stdout"
  changed_when: true
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Ensure sa-eva-agent serviceaccount exists
  ansible.builtin.command: >-
    kubectl get serviceaccount sa-eva-agent -n {{ eva_agent_namespace }}
  register: eva_agent_sa_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Create sa-eva-agent serviceaccount when missing
  ansible.builtin.command: >-
    kubectl create serviceaccount sa-eva-agent -n {{ eva_agent_namespace }}
  when:
    - not ansible_check_mode
    - eva_agent_sa_check.rc != 0
  changed_when: true
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Check existing eva-agent-vllm deployment
  ansible.builtin.command: kubectl get deployment {{ eva_agent_vllm_engine_deployment_name }} -n {{ eva_agent_namespace }}
  register: eva_agent_vllm_deployment_exists
  changed_when: false
  failed_when: false
  when: not ansible_check_mode
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Scale down existing eva-agent-vllm deployment
  ansible.builtin.command: >-
    kubectl scale deployment {{ eva_agent_vllm_engine_deployment_name }}
    -n {{ eva_agent_namespace }} --replicas=0
  register: eva_agent_vllm_scale_down
  changed_when: "'scaled' in eva_agent_vllm_scale_down.stdout"
  when:
    - not ansible_check_mode
    - eva_agent_vllm_deployment_exists.rc == 0
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Check existing eva-agent-vllm router deployment
  ansible.builtin.command: kubectl get deployment eva-agent-vllm-deployment-router -n {{ eva_agent_namespace }}
  register: eva_agent_vllm_router_deployment_exists
  changed_when: false
  failed_when: false
  when: not ansible_check_mode
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Scale down existing eva-agent-vllm router deployment
  ansible.builtin.command: >-
    kubectl scale deployment eva-agent-vllm-deployment-router
    -n {{ eva_agent_namespace }} --replicas=0
  register: eva_agent_vllm_router_scale_down
  changed_when: "'scaled' in eva_agent_vllm_router_scale_down.stdout"
  when:
    - not ansible_check_mode
    - eva_agent_vllm_router_deployment_exists.rc == 0
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Check existing eva-agent-qdrant statefulset
  ansible.builtin.command: kubectl get statefulset eva-agent-qdrant -n {{ eva_agent_namespace }}
  register: eva_agent_qdrant_statefulset_exists
  changed_when: false
  failed_when: false
  when: not ansible_check_mode
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Scale down existing eva-agent-qdrant statefulset
  ansible.builtin.command: kubectl scale statefulset eva-agent-qdrant -n {{ eva_agent_namespace }} --replicas=0
  register: eva_agent_qdrant_scale_down
  changed_when: "'scaled' in eva_agent_qdrant_scale_down.stdout"
  when:
    - not ansible_check_mode
    - eva_agent_qdrant_statefulset_exists.rc == 0
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Force delete remaining eva-agent-vllm pods before reinstall
  ansible.builtin.command: >-
    kubectl delete pod
    -n {{ eva_agent_namespace }}
    -l app.kubernetes.io/instance=eva-agent-vllm
    --ignore-not-found=true
    --grace-period=0
    --force
  register: eva_agent_vllm_force_delete
  changed_when: "'deleted' in eva_agent_vllm_force_delete.stdout"
  when: not ansible_check_mode
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Force delete remaining eva-agent-qdrant pods before reinstall
  ansible.builtin.command: >-
    kubectl delete pod
    -n {{ eva_agent_namespace }}
    -l app.kubernetes.io/instance=eva-agent-qdrant
    --ignore-not-found=true
    --grace-period=0
    --force
  register: eva_agent_qdrant_force_delete
  changed_when: "'deleted' in eva_agent_qdrant_force_delete.stdout"
  when: not ansible_check_mode
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"

- name: Wait until eva-agent-vllm pods are terminated before reinstall
  ansible.builtin.command: >-
    kubectl wait --for=delete pod
    -n {{ eva_agent_namespace }}
    -l app.kubernetes.io/instance=eva-agent-vllm
    --timeout=240s
  register: eva_agent_vllm_wait_delete
  changed_when: false
