# 외부 IAM 연동 + App HTTP. IAM 자체는 설치하지 않으며 IAM/Redis 프로토콜은 별도로 입력합니다.
app:
  ingress:
    path: /
    tls:
      enabled: false
      create: false
  app:
    backendHost: "<APP_HOST>" # 필수: App 도메인 또는 IP, scheme/port/path 제외. ex) app.eva.com 또는 192.0.2.10
    backendSecure: false
    backendPublicPort: 80 # App HTTP 외부 포트. 외부 IAM의 App client redirect URI에도 반영합니다.
    browserTitleName: EVA
    license:
      activation_mode: online
      product_code: "<LICENSE_PRODUCT_CODE>" # 필수: 승인된 license 제품 코드. ex) eva
      api_key: "<LICENSE_API_KEY>" # 필수: 발급된 license API key. ex) demo-license-api-key (예시 전용)
      shared_key: "<LICENSE_SHARED_KEY>" # 필수: 발급된 license shared key. ex) demo-license-shared-key (예시 전용)