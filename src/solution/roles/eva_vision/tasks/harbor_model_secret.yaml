# This runs on the TARGET, only for an absent, selected private model Secret.
# Reuse the exact registry auth installed by EVA infra; never read controller
# credentials, choose another registry, or change Harbor project visibility.
- name: Create Vision Harbor model credentials from target k3s registry auth
  no_log: true
  vars:
    eva_vision_model_registry: >-
      {{ eva_vision_runtime_values.harbor.registry | trim
         | regex_replace('^https?://', '') | regex_replace('/+$', '') }}
  block:
    - name: Read target k3s registry configuration for Vision models
      ansible.builtin.slurp:
        src: "{{ eva_vision_registry_config_path | default('/etc/rancher/k3s/registries.yaml') }}"
      register: eva_vision_registry_config_raw

    - name: Parse target k3s registry configuration for Vision models
      ansible.builtin.set_fact:
        eva_vision_registry_config: "{{ eva_vision_registry_config_raw.content | b64decode | from_yaml }}"

    - name: Validate target k3s registry configuration mappings
      ansible.builtin.assert:
        that:
          - eva_vision_registry_config is mapping
          - eva_vision_registry_config.get('configs') is mapping

    - name: Validate exact target Harbor registry authentication
      ansible.builtin.assert:
        that:
          - eva_vision_model_registry | length > 0
          - eva_vision_registry_config.configs.get(eva_vision_model_registry) is mapping
          - eva_vision_registry_config.configs[eva_vision_model_registry].get('auth') is mapping
          - eva_vision_registry_config.configs[eva_vision_model_registry].auth.get('username') is string
          - eva_vision_registry_config.configs[eva_vision_model_registry].auth.get('password') is string
          - eva_vision_registry_config.configs[eva_vision_model_registry].auth.username | trim | length > 0
          - eva_vision_registry_config.configs[eva_vision_model_registry].auth.password | trim | length > 0

    - name: Create EVA Vision namespace for Harbor model credentials
      ansible.builtin.shell: >-
        set -o pipefail;
        kubectl create namespace {{ eva_vision_namespace | quote }} --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      register: eva_vision_model_namespace
      changed_when: "'created' in eva_vision_model_namespace.stdout"
      environment:
        KUBECONFIG: "{{ eva_vision_kubeconfig }}"

    # Create, never apply/replace: preserve operator credentials and fail safely
    # if another writer creates the Secret after the preceding absence check.
    # JSON stdin avoids credential arguments, temporary files and Helm Values.
    - name: Create EVA Vision Harbor model Secret without overwriting existing credentials
      ansible.builtin.command:
        argv: [kubectl, create, -f, '-']
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret', 'type': 'Opaque',
              'metadata': {'name': eva_vision_model_secret_name, 'namespace': eva_vision_namespace},
              'stringData': {
                'HARBOR_USERNAME': eva_vision_registry_config.configs[eva_vision_model_registry].auth.username,
                'HARBOR_PASSWORD': eva_vision_registry_config.configs[eva_vision_model_registry].auth.password}} | to_json }}
      environment:
        KUBECONFIG: "{{ eva_vision_kubeconfig }}"
      changed_when: true
  rescue:
    - name: Explain EVA infra registry setup recovery for Vision models
      no_log: false
      ansible.builtin.fail:
        msg: >-
          Cannot prepare Vision Harbor model Secret '{{ eva_vision_model_secret_name }}'
          in namespace '{{ eva_vision_namespace }}' for registry '{{ eva_vision_model_registry }}'.
          Restore or rerun the existing EVA infra registry setup on this target so its k3s
          registries.yaml has matching configs[registry].auth with nonempty string username/password,
          and ensure Kubernetes allows namespace/Secret creation. Existing Secrets are never overwritten.
  always:
    - name: Clear transient Vision target registry credential facts
      ansible.builtin.set_fact:
        eva_vision_registry_config_raw: {}
        eva_vision_registry_config: {}