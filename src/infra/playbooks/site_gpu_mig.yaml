- name: Configure MIG only
  hosts: all
  become: true
  any_errors_fatal: true
  serial: 1
  vars_files:
    - ../../playbook-vars.yaml

  pre_tasks:
    - name: Load shared EVA playbook context
      ansible.builtin.import_tasks: ../../playbook-preflight.yaml

    - name: Resolve repository mode
      ansible.builtin.set_fact:
        repository_mode: "{{ repository_mode | default('cloud_repository') }}"
        airgap_mode: "{{ (airgap_mode | default(false) | bool) or ((repository_mode | default('cloud_repository')) in ['remote_repository', 'local_repository']) }}"
      changed_when: false

  tasks:
    - name: STEP 1 - mig
      ansible.builtin.import_role:
        name: gpu_mig
      vars:
        gpu_mig_enable_mig_workflow: true
