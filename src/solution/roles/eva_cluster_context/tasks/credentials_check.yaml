---
- name: Check selected cluster ECR credential pairs and Release image access
  ansible.builtin.include_tasks: online_credentials.yaml
  loop: "{{ eva_enabled_components.split(',') | intersect(['iam', 'app', 'agent', 'vision']) }}"
  loop_control:
    loop_var: eva_online_component
  vars:
    eva_online_action: check
