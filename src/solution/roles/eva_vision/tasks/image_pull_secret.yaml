- name: Prepare host-managed Vision ECR renewal
  ansible.builtin.include_tasks: image_pull_secret_host.yaml
  when: not (eva_managed_cluster | default(false) | bool)

- name: Prepare cluster-managed Vision ECR renewal
  ansible.builtin.include_tasks: image_pull_secret_cluster.yaml
  when: eva_managed_cluster | default(false) | bool
