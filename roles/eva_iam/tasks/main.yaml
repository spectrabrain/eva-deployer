- name: Resolve eva-iam host settings file
  ansible.builtin.set_fact:
    eva_iam_values_host: "{{ ansible_host | default(inventory_hostname) }}"
    eva_iam_values_file: "{{ eva_iam_values_file | default(playbook_dir ~ '/values/eva-iam.yaml') }}"
    # Base dir for all eva-iam paths (workdir + node hostPath dirs). Everything hangs off this.
    eva_iam_base_dir: "{{ eva_iam_base_dir | default(ansible_facts['env']['HOME'] ~ '/.eva-iam') }}"

- name: Check for eva-iam host settings file on control node
  ansible.builtin.stat:
    path: "{{ eva_iam_values_file }}"
  register: eva_iam_values_file_stat
  delegate_to: localhost
  become: false

- name: Load eva-iam host settings file
  ansible.builtin.include_vars:
    file: "{{ eva_iam_values_file }}"
    name: eva_iam_values_loaded
  when: eva_iam_values_file_stat.stat.exists

- name: Apply eva-iam host settings (host-keyed block or flat)
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ (eva_iam_values_loaded[eva_iam_values_host] | default(eva_iam_values_loaded)) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  when: eva_iam_values_file_stat.stat.exists

- name: Set EVA IAM (SSO) install defaults
  no_log: true
  ansible.builtin.set_fact:
    repository_mode: "{{ repository_mode | default('cloud_repository') }}"
    eva_iam_namespace: "{{ eva_iam_namespace | default('eva-iam') }}"
    eva_iam_name: "{{ eva_iam_name | default('eva-iam') }}"
    # Opt-in guard: release identities ("<namespace>/<name>") this automation must never overwrite.
    # Empty by default; set e.g. -e '{"eva_iam_protected_releases": ["eva-iam/eva-iam"]}' to protect one.
    eva_iam_protected_releases: "{{ eva_iam_protected_releases | default([]) }}"
    eva_iam_kubeconfig: "{{ eva_iam_kubeconfig | default(ansible_facts['env']['HOME'] ~ '/.kube/config') }}"
    # Workspace on the target where the rendered helm override values are written.
    eva_iam_workdir: "{{ eva_iam_workdir | default(eva_iam_base_dir) }}"
    # Published Helm chart. The realm (Keycloak/clients/secrets) is baked into the chart now —
    # we only override the values below; no local chart copy or realm JSON handling needed.
    eva_iam_chart_repo_name: "{{ eva_iam_chart_repo_name | default('eva-iam') }}"
    eva_iam_chart_repo_url: "{{ eva_iam_chart_repo_url | default('https://mellerikat.github.io/eva-iam') }}"
    eva_iam_chart_ref: "{{ eva_iam_chart_ref | default('eva-iam/eva-iam') }}"
    eva_iam_chart_version: "{{ eva_iam_chart_version | default(deploy_versions.eva_iam_chart_version | mandatory) }}"
    # config.host — keycloak/dispatcher/ingress all derive from it.
    eva_iam_host: "{{ eva_iam_host | default('e2e.eva-dev.lge.com') }}"
    # keycloak.realmConfig.substitutions (values injected into the chart's realm template)
    eva_iam_admin_password: "{{ eva_iam_admin_password | default('ChangeMe-1!') }}"
    eva_iam_admin_email: "{{ eva_iam_admin_email | default('admin@eva.com') }}"
    # empty -> derived from host as https://<host>/* in the template
    eva_iam_app_redirect_uri: "{{ eva_iam_app_redirect_uri | default('') }}"
    # ingress
    eva_iam_ingress_path: "{{ eva_iam_ingress_path | default('/iam') }}"
    eva_iam_tls_host_path: "{{ eva_iam_tls_host_path | default(eva_iam_base_dir ~ '/certs') }}"
    # persistence
    eva_iam_persistence_host_path: "{{ eva_iam_persistence_host_path | default(eva_iam_base_dir ~ '/host-path') }}"
    # database internal service NodePort
    eva_iam_db_nodeport: "{{ eva_iam_db_nodeport | default(32091) | int }}"
    # imagePullSecrets: ECR creds directory on the node (chart pulls images from ECR)
    eva_iam_image_pull_host_path: >-
      {{ eva_iam_image_pull_host_path
         | default('/home/' ~ (ansible_user | default(ansible_ssh_user | default('eva'))) ~ '/.aws') }}

- name: Validate repository mode for EVA IAM
  ansible.builtin.assert:
    that:
      - repository_mode == 'cloud_repository'
    fail_msg: >-
      eva_iam role은 현재 cloud_repository 모드만 지원합니다 (Helm repo + ECR pull).

- name: Refuse to deploy onto a protected (existing) release
  ansible.builtin.assert:
    that:
      - (eva_iam_namespace ~ '/' ~ eva_iam_name) not in eva_iam_protected_releases
    fail_msg: >-
      대상 릴리스 '{{ eva_iam_namespace }}/{{ eva_iam_name }}' 는 보호 목록에 있어 덮어쓸 수 없습니다.
      기존(운영) 릴리스를 건드리지 않도록 -e eva_iam_name=<다른 이름> -e eva_iam_namespace=<다른 ns> 로
      새 인스턴스를 지정하세요. (정말 덮어써야 하면 -e eva_iam_protected_releases='[]' 로 해제)

- name: Ensure EVA IAM workspace exists on target
  ansible.builtin.file:
    path: "{{ eva_iam_workdir }}"
    state: directory
    mode: "0755"

- name: Render eva-iam helm override values on target
  no_log: true
  ansible.builtin.template:
    src: eva-iam-k3s-override.yaml.j2
    dest: "{{ eva_iam_workdir }}/eva-iam-k3s-override.yaml"
    mode: "0644"
  when: not ansible_check_mode

- name: Add Helm repository for eva-iam
  ansible.builtin.command: helm repo add {{ eva_iam_chart_repo_name }} {{ eva_iam_chart_repo_url }}
  register: eva_iam_repo_add
  changed_when: "'already exists' not in (eva_iam_repo_add.stdout + eva_iam_repo_add.stderr)"
  failed_when:
    - eva_iam_repo_add.rc != 0
    - "'already exists' not in (eva_iam_repo_add.stdout + eva_iam_repo_add.stderr)"
  environment:
    KUBECONFIG: "{{ eva_iam_kubeconfig }}"

- name: Update Helm repository
  ansible.builtin.command: helm repo update {{ eva_iam_chart_repo_name }}
  changed_when: true
  environment:
    KUBECONFIG: "{{ eva_iam_kubeconfig }}"

- name: Check k3s API accessibility for eva-iam
  ansible.builtin.command:
    cmd: kubectl get nodes --no-headers
  environment:
    KUBECONFIG: "{{ eva_iam_kubeconfig }}"
  register: eva_iam_k3s_check
  changed_when: false

- name: Detect NodePort collision from another namespace
  ansible.builtin.shell: >-
    set -o pipefail;
    kubectl get svc -A
    -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{" "}{.spec.ports[*].nodePort}{"\n"}{end}'
    | awk '$0 ~ /(^| ){{ eva_iam_db_nodeport }}( |$)/ && $1 != "{{ eva_iam_namespace }}"'
  args:
    executable: /bin/bash
  register: eva_iam_nodeport_conflict
  changed_when: false
  when: not ansible_check_mode
  environment:
    KUBECONFIG: "{{ eva_iam_kubeconfig }}"

- name: Fail fast on NodePort collision
  ansible.builtin.assert:
    that:
      - (eva_iam_nodeport_conflict.stdout | default('')) | trim | length == 0
    fail_msg: >-
      NodePort {{ eva_iam_db_nodeport }} 가 이미 다른 서비스에서 사용 중입니다:
      [{{ eva_iam_nodeport_conflict.stdout | default('') | trim }}].
      -e eva_iam_db_nodeport=<다른 포트> 로 지정하세요.
  when: not ansible_check_mode

- name: Install/upgrade eva-iam from Helm repo
  ansible.builtin.command: >-
    helm upgrade --install {{ eva_iam_name }} {{ eva_iam_chart_ref }}
    -n {{ eva_iam_namespace }}
    --version {{ eva_iam_chart_version }}
    --create-namespace
    -f {{ eva_iam_workdir }}/eva-iam-k3s-override.yaml
  register: eva_iam_install
  changed_when: >-
    'has been upgraded' in eva_iam_install.stdout
    or 'has been installed' in eva_iam_install.stdout
  when: not ansible_check_mode
  environment:
    KUBECONFIG: "{{ eva_iam_kubeconfig }}"

- name: Wait for keycloak rollout
  ansible.builtin.command: >-
    kubectl rollout status deployment/{{ eva_iam_name }}-keycloak
    -n {{ eva_iam_namespace }}
    --timeout=600s
  register: eva_iam_keycloak_rollout
  changed_when: false
  when: not ansible_check_mode
  environment:
    KUBECONFIG: "{{ eva_iam_kubeconfig }}"

- name: Check eva-iam resources
  ansible.builtin.command: kubectl get all -n {{ eva_iam_namespace }}
  register: eva_iam_resources
  changed_when: false
  when: not ansible_check_mode
  environment:
    KUBECONFIG: "{{ eva_iam_kubeconfig }}"

- name: Show eva-iam deployment summary
  ansible.builtin.debug:
    msg:
      - "namespace/release : {{ eva_iam_namespace }}/{{ eva_iam_name }}"
      - "chart             : {{ eva_iam_chart_ref }} {{ eva_iam_chart_version }}"
      - "base URL          : https://{{ eva_iam_host }}{{ eva_iam_ingress_path }}"
      - "admin console     : https://{{ eva_iam_host }}{{ eva_iam_ingress_path }}/admin"
      - "realm             : eva-iam"
      - "resources:"
      - "{{ eva_iam_resources.stdout_lines | default([]) }}"
  when: not ansible_check_mode
