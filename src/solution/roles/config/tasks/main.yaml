- name: Apply auto-update settings
  ansible.builtin.import_tasks: auto_update.yaml

- name: Apply auto-login settings
  ansible.builtin.import_tasks: auto_login.yaml

- name: Detect NVIDIA GPU presence for Config
  ansible.builtin.import_tasks: "{{ eva_infra_root }}/roles/gpu/tasks/detect.yaml"

- name: Apply GPU CDI settings
  ansible.builtin.import_tasks: gpu_cdi.yaml
  when:
    - gpu_has_nvidia | default(false) | bool
    - (config_gpu_cdi_status | default('enabled') | lower) == 'enabled'

- name: Write EVA summary file
  ansible.builtin.import_tasks: eva.yaml

- name: Write cluster secret file
  ansible.builtin.import_tasks: secret.yaml
