---
- name: Render EVA Agent namespace before preparing workload credentials
  ansible.builtin.command:
    argv: [kubectl, create, namespace, "{{ eva_agent_namespace }}", --dry-run=client, -o, json]
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"
  register: eva_agent_namespace_document
  changed_when: false

- name: Prepare EVA Agent namespace before workload credentials
  ansible.builtin.command:
    argv: [kubectl, apply, -f, '-']
    stdin: "{{ eva_agent_namespace_document.stdout }}"
  environment:
    KUBECONFIG: "{{ eva_agent_kubeconfig }}"
  changed_when: "'created' in eva_agent_namespace_apply.stdout"
  register: eva_agent_namespace_apply

- name: Resolve EVA Agent namespace credential names
  ansible.builtin.set_fact:
    eva_agent_aws_credentials_secret_name: "{{ eva_agent_workspace_chart_values.awsCredentialsSecretName | default('aws-credentials') }}"
    eva_agent_repository_pull_secret_name: "{{ eva_agent_repository_pull_secret_name | default('eva-harbor-pull') }}"
    eva_agent_repository_pull_secrets: []

- name: Prepare Online AWS credentials for Agent ECR and dependency S3 access
  when:
    - repository_mode in ['online_repository', 'cloud_repository']
    - eva_agent_sync_aws_credentials | int == 1
  no_log: true
  block:
    - name: Check existing Agent AWS Secret
      ansible.builtin.command:
        argv: [kubectl, -n, "{{ eva_agent_namespace }}", get, secret, "{{ eva_agent_aws_credentials_secret_name }}", --ignore-not-found, -o, json]
      environment:
        KUBECONFIG: "{{ eva_agent_kubeconfig }}"
      register: eva_agent_aws_secret_check
      changed_when: false

    - name: Validate existing Agent AWS credential pair
      ansible.builtin.assert:
        that:
          - (eva_agent_aws_secret_check.stdout | from_json).data.AWS_ACCESS_KEY_ID | b64decode | trim | length > 0
          - (eva_agent_aws_secret_check.stdout | from_json).data.AWS_SECRET_ACCESS_KEY | b64decode | trim | length > 0
      when: eva_agent_aws_secret_check.stdout | trim | length > 0

    - name: Create missing Agent AWS Secret from the Online workspace
      when: eva_agent_aws_secret_check.stdout | trim | length == 0
      block:
        - name: Read Online workspace AWS credential file
          ansible.builtin.set_fact:
            eva_agent_aws_key_raw: >-
              {{ lookup('ansible.builtin.file', aws_key_file
                 if aws_key_file | default('') | length > 0
                 else eva_workspace_credentials_root ~ '/aws_key.ini') }}

        - name: Resolve Online workspace AWS credential pair
          ansible.builtin.set_fact:
            eva_agent_aws_access_key: "{{ (eva_agent_aws_key_raw | regex_findall('(?m)^\\s*aws_access_key_id\\s*=\\s*(.+)\\s*$') | first | default('')) | trim }}"
            eva_agent_aws_secret_key: "{{ (eva_agent_aws_key_raw | regex_findall('(?m)^\\s*aws_secret_access_key\\s*=\\s*(.+)\\s*$') | first | default('')) | trim }}"
            eva_agent_aws_region: "{{ (eva_agent_aws_key_raw | regex_findall('(?m)^\\s*region\\s*=\\s*(.+)\\s*$') | first | default('ap-northeast-2')) | trim }}"

        - name: Validate Online workspace AWS credential pair
          ansible.builtin.assert:
            that:
              - eva_agent_aws_access_key | length > 0
              - eva_agent_aws_secret_key | length > 0

        - name: Create Agent AWS Secret through private stdin
          ansible.builtin.command:
            argv: [kubectl, create, -f, '-']
            stdin: >-
              {{ {'apiVersion': 'v1', 'kind': 'Secret', 'type': 'Opaque',
                  'metadata': {'name': eva_agent_aws_credentials_secret_name, 'namespace': eva_agent_namespace},
                  'stringData': {'AWS_ACCESS_KEY_ID': eva_agent_aws_access_key,
                                 'AWS_SECRET_ACCESS_KEY': eva_agent_aws_secret_key,
                                 'AWS_REGION': eva_agent_aws_region}} | to_json }}
          environment:
            KUBECONFIG: "{{ eva_agent_kubeconfig }}"
          changed_when: true
  rescue:
    - name: Explain Online Agent AWS credential preparation failure
      no_log: false
      ansible.builtin.fail:
        msg: >-
          Cannot prepare '{{ eva_agent_aws_credentials_secret_name }}' in '{{ eva_agent_namespace }}'.
          Provide a valid Online workspace AWS credential file or an existing Secret with
          AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. The account needs access to the selected
          Agent ECR repository and spectrabrain-eva-agent S3 bucket. Existing Secrets are preserved.
  always:
    - name: Clear transient Online Agent AWS credentials
      ansible.builtin.set_fact:
        eva_agent_aws_secret_check: {}
        eva_agent_aws_key_raw: ''
        eva_agent_aws_access_key: ''
        eva_agent_aws_secret_key: ''

- name: Prepare Agent Harbor pull access on the target
  ansible.builtin.include_role:
    name: eva_k3s_registry
  vars:
    eva_registry_namespace: "{{ eva_agent_namespace }}"
    eva_registry_secret: "{{ eva_agent_repository_pull_secret_name }}"
    eva_registry_kubeconfig: "{{ eva_agent_kubeconfig }}"
  when: repository_mode in ['remote_repository', 'local_repository'] or eva_agent_qdrant_snapshot_source == 'harbor'

- name: Resolve prepared Agent Harbor pull Secret reference
  when: repository_mode in ['remote_repository', 'local_repository']
  block:
    - name: Check namespace Harbor pull Secret
      ansible.builtin.command:
        argv: [kubectl, -n, "{{ eva_agent_namespace }}", get, secret, "{{ eva_agent_repository_pull_secret_name }}", --ignore-not-found, -o, name]
      environment:
        KUBECONFIG: "{{ eva_agent_kubeconfig }}"
      register: eva_agent_pull_secret_check
      changed_when: false

    - name: Record Agent Harbor pull Secret name
      ansible.builtin.set_fact:
        eva_agent_repository_pull_secrets: "{{ [eva_agent_repository_pull_secret_name] if eva_agent_pull_secret_check.stdout | trim | length > 0 else [] }}"

- name: Prepare Qdrant Harbor snapshot credentials without replacing existing Secrets
  when: eva_agent_qdrant_snapshot_source == 'harbor'
  no_log: true
  block:
    - name: Check existing Qdrant Harbor snapshot Secret
      ansible.builtin.command:
        argv: [kubectl, -n, "{{ eva_agent_namespace }}", get, secret, qdrant-snapshot-harbor, --ignore-not-found, -o, json]
      environment:
        KUBECONFIG: "{{ eva_agent_kubeconfig }}"
      register: eva_agent_snapshot_secret_check
      changed_when: false

    - name: Validate existing Qdrant snapshot credential pair
      ansible.builtin.assert:
        that:
          - (eva_agent_snapshot_secret_check.stdout | from_json).data.username | b64decode | trim | length > 0
          - (eva_agent_snapshot_secret_check.stdout | from_json).data.password | b64decode | trim | length > 0
      when: eva_agent_snapshot_secret_check.stdout | trim | length > 0

    - name: Create missing Qdrant snapshot Secret from the selected target pull credentials
      when: eva_agent_snapshot_secret_check.stdout | trim | length == 0
      block:
        - name: Read selected target Harbor pull Secret privately
          ansible.builtin.command:
            argv: [kubectl, -n, "{{ eva_agent_namespace }}", get, secret, "{{ eva_agent_repository_pull_secret_name }}", -o, json]
          environment:
            KUBECONFIG: "{{ eva_agent_kubeconfig }}"
          register: eva_agent_snapshot_pull_secret
          changed_when: false

        - name: Decode exact registry auth from the target pull Secret
          ansible.builtin.set_fact:
            eva_agent_snapshot_docker_config: "{{ (eva_agent_snapshot_pull_secret.stdout | from_json).data['.dockerconfigjson'] | b64decode | from_json }}"

        - name: Resolve exact Harbor username and password privately
          ansible.builtin.set_fact:
            eva_agent_snapshot_auth: >-
              {{ eva_agent_snapshot_docker_config.auths.get(repository_registry,
                   eva_agent_snapshot_docker_config.auths.get('http://' ~ repository_registry,
                     eva_agent_snapshot_docker_config.auths.get('https://' ~ repository_registry, {}))) }}

        - name: Resolve Harbor credential pair from Docker auth
          ansible.builtin.set_fact:
            eva_agent_snapshot_pair: >-
              {{ (eva_agent_snapshot_auth.auth | b64decode).split(':', 1)
                 if eva_agent_snapshot_auth.auth | default('') | length > 0
                 else [eva_agent_snapshot_auth.username | default(''), eva_agent_snapshot_auth.password | default('')] }}

        - name: Validate exact Harbor credential pair
          ansible.builtin.assert:
            that:
              - eva_agent_snapshot_pair | length == 2
              - eva_agent_snapshot_pair[0] | trim | length > 0
              - eva_agent_snapshot_pair[1] | length > 0

        - name: Create Qdrant snapshot Secret through private stdin
          ansible.builtin.command:
            argv: [kubectl, create, -f, '-']
            stdin: >-
              {{ {'apiVersion': 'v1', 'kind': 'Secret', 'type': 'Opaque',
                  'metadata': {'name': 'qdrant-snapshot-harbor', 'namespace': eva_agent_namespace},
                  'stringData': {'username': eva_agent_snapshot_pair[0], 'password': eva_agent_snapshot_pair[1]}} | to_json }}
          environment:
            KUBECONFIG: "{{ eva_agent_kubeconfig }}"
          changed_when: true
  rescue:
    - name: Explain Qdrant Harbor credential preparation failure
      no_log: false
      ansible.builtin.fail:
        msg: >-
          Cannot prepare qdrant-snapshot-harbor in {{ eva_agent_namespace }}.
          Provide approved Harbor username/password credentials on this target,
          or provision the existing snapshot Secret. Existing Secrets are preserved.
  always:
    - name: Clear transient Qdrant Harbor credentials
      ansible.builtin.set_fact:
        eva_agent_snapshot_secret_check: {}
        eva_agent_snapshot_pull_secret: {}
        eva_agent_snapshot_docker_config: {}
        eva_agent_snapshot_auth: {}
        eva_agent_snapshot_pair: []
