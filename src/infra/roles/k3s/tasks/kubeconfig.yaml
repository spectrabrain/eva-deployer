- name: Resolve kubeconfig target users
  ansible.builtin.set_fact:
    k3s_kubeconfig_users: "{{ [ansible_user | default('root'), 'root'] | unique }}"

- name: Lookup home directory for kubeconfig users
  ansible.builtin.getent:
    database: passwd
    key: "{{ item }}"
  loop: "{{ k3s_kubeconfig_users }}"
  register: k3s_kubeconfig_user_homes

- name: Create kube config directory for each target user
  ansible.builtin.file:
    path: "{{ item.ansible_facts.getent_passwd[item.item][4] }}/.kube"
    state: directory
    owner: "{{ item.item }}"
    mode: '0700'
  loop: "{{ k3s_kubeconfig_user_homes.results }}"
  when: not ansible_check_mode

- name: Copy kubeconfig for each target user
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ item.ansible_facts.getent_passwd[item.item][4] }}/.kube/config"
    remote_src: true
    owner: "{{ item.item }}"
    mode: '0600'
  loop: "{{ k3s_kubeconfig_user_homes.results }}"
  when: not ansible_check_mode
