name: Tag Base Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-base-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python3 -m pip install --user \
            ansible==13.6.0 \
            ansible-core==2.20.5 \
            yamllint==1.37.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify tag checkout is clean and exact
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"

      - name: Check Go formatting
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Test and vet Go CLI
        working-directory: tools/eva
        run: |
          go mod download
          go test ./...
          go vet ./...

      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Run ShellCheck
        run: |
          while IFS= read -r -d '' script; do
            shellcheck "$script"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Lint YAML
        run: |
          yamllint -d '{extends: default, rules: {document-start: disable, line-length: disable, truthy: disable}}' \
            $(git ls-files '*.yaml' '*.yml')

      - name: Check Ansible playbook syntax
        run: |
          for playbook in src/infra/playbooks/*.yaml src/solution/playbooks/*.yaml; do
            ansible-playbook --syntax-check \
              -i workspace/inventory/inventory.ini.sample \
              "$playbook"
          done

      - name: Build and verify Base Release
        run: |
          scripts/release/build_release.sh --tag "$GITHUB_REF_NAME" --dist-dir out/dist
          out/work/build/eva verify out/dist

      - name: Upload Base Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eva-base-release-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            out/dist/eva-tool_*.tar.gz
            out/dist/eva-infra_*.tar.gz
            out/dist/eva-solution_*.tar.gz
            out/dist/release.yaml
            out/dist/checksums.sha256
