# site_eva_agent.yaml
- name: Configure EVA Agent
  hosts: all
  become: true
  any_errors_fatal: true
  serial: 1

  pre_tasks:
    - name: Resolve repository mode
      ansible.builtin.set_fact:
        repository_mode: "{{ repository_mode | default('cloud_repository') }}"
        airgap_mode: "{{ (airgap_mode | default(false) | bool) or ((repository_mode | default('cloud_repository')) in ['remote_repository', 'local_repository']) }}"
      changed_when: false

    - name: Resolve Harbor endpoint metadata path
      ansible.builtin.set_fact:
        eva_agent_harbor_endpoint_file: >-
          {{ eva_agent_harbor_endpoint_file | default(playbook_dir ~ '/install/harbor-endpoint.yaml') }}
      when: repository_mode in ['remote_repository', 'local_repository']
      changed_when: false

    - name: Check Harbor endpoint metadata on deployment controller
      ansible.builtin.stat:
        path: "{{ eva_agent_harbor_endpoint_file }}"
      register: eva_agent_harbor_endpoint_file_stat
      delegate_to: localhost
      become: false
      when: repository_mode in ['remote_repository', 'local_repository']

    - name: Load Harbor endpoint metadata
      ansible.builtin.include_vars:
        file: "{{ eva_agent_harbor_endpoint_file }}"
        name: eva_agent_harbor_endpoint
      when:
        - repository_mode in ['remote_repository', 'local_repository']
        - eva_agent_harbor_endpoint_file_stat.stat.exists

    - name: Apply Harbor endpoint metadata to the Qdrant snapshot sidecar
      ansible.builtin.set_fact:
        eva_agent_qdrant_snapshot_harbor_registry: "{{ eva_agent_harbor_endpoint.harbor_registry }}"
      when:
        - repository_mode in ['remote_repository', 'local_repository']
        - eva_agent_harbor_endpoint_file_stat.stat.exists
        - eva_agent_qdrant_snapshot_harbor_registry is not defined
      changed_when: false

    - name: Resolve eva.yaml config host
      ansible.builtin.set_fact:
        eva_agent_config_host: "{{ eva_agent_config_host | default(ansible_host | default(inventory_hostname)) }}"
      changed_when: false

    - name: Resolve eva.yaml path generated by site_eva_config
      ansible.builtin.set_fact:
        eva_agent_generated_config_path: "{{ playbook_dir }}/config/{{ eva_agent_config_host }}/eva.yaml"
      changed_when: false

    - name: Check eva.yaml exists on control node
      ansible.builtin.stat:
        path: "{{ eva_agent_generated_config_path }}"
      register: eva_agent_generated_config_stat
      delegate_to: localhost
      become: false

    - name: Ensure eva.yaml exists before eva_agent install
      ansible.builtin.assert:
        that:
          - eva_agent_generated_config_stat.stat.exists
        fail_msg: >-
          {{ eva_agent_generated_config_path }} 파일이 없습니다.
          먼저 site_eva_config.yaml을 실행해 eva.yaml을 생성하세요.

    - name: Load eva.yaml generated config
      ansible.builtin.include_vars:
        file: "{{ eva_agent_generated_config_path }}"
        name: eva_agent_generated_config

    - name: Apply eva.yaml defaults for eva_agent
      ansible.builtin.set_fact:
        eva_agent_nfs_share_path: "{{ eva_agent_generated_config.nfs_share_path | default(eva_agent_nfs_share_path | default(omit)) }}"
        eva_agent_vllm_values_override_from_config: "{{ eva_agent_generated_config.vllm | default({}) }}"
      changed_when: false

    - name: Build airgap install root candidates on target
      ansible.builtin.set_fact:
        eva_agent_airgap_install_root_candidates:
          - "{{ playbook_dir }}/install"
      when:
        - (airgap_mode | default(false) | bool) or ((repository_mode | default('cloud_repository')) in ['remote_repository', 'local_repository'])
        - eva_agent_install_root is not defined
      changed_when: false

    - name: Check airgap install root candidates
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ eva_agent_airgap_install_root_candidates }}"
      register: eva_agent_airgap_install_root_stats
      when:
        - (airgap_mode | default(false) | bool) or ((repository_mode | default('cloud_repository')) in ['remote_repository', 'local_repository'])
        - eva_agent_install_root is not defined

    - name: Resolve detected airgap install root
      ansible.builtin.set_fact:
        eva_agent_install_root: >-
          {{
            (
              eva_agent_airgap_install_root_stats.results
              | selectattr('stat.exists', 'equalto', true)
              | map(attribute='item')
              | list
              | first
            ) | default(omit)
          }}
      when:
        - (airgap_mode | default(false) | bool) or ((repository_mode | default('cloud_repository')) in ['remote_repository', 'local_repository'])
        - eva_agent_install_root is not defined
      changed_when: false

    - name: Assert airgap install root exists when auto-detect is used
      ansible.builtin.assert:
        that:
          - eva_agent_install_root is defined
        fail_msg: >-
          airgap install 경로를 자동 탐지하지 못했습니다.
          {{ playbook_dir }}/install 경로를 준비하거나
          -e eva_agent_install_root=<install 경로> 를 지정하세요.
      when:
        - (airgap_mode | default(false) | bool) or ((repository_mode | default('cloud_repository')) in ['remote_repository', 'local_repository'])

  tasks:
    - name: STEP 1 - eva-agent
      ansible.builtin.import_role:
        name: eva_agent
