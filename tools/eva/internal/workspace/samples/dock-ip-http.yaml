# EVA-Dock: App과 같은 IP + Dock 전용 HTTP 포트. ex) http://192.0.2.10:32020/
# Dock은 / 와 /api 를 사용하므로 App(/)과 다른 공개 포트로 분리합니다. Deployer가 Traefik listener를 함께 정합화합니다.
dock:
  ingress:
    host: "<PUBLIC_HOST>"  # 필수: scheme, port, path 없는 IP. App과 같은 IP를 사용합니다. ex) 192.0.2.10
    tls:
      enabled: false  # HTTP: Ingress TLS 및 TLS Secret Job을 사용하지 않습니다.
      create: false
  config:
    dockPublicUrl: "http://<PUBLIC_HOST>:32020"  # 필수: 브라우저·EVA 웹훅이 접근할 Dock 외부 주소. 포트를 바꾸면 Traefik 공개 포트도 함께 바뀝니다. ex) http://192.0.2.10:32020
  secrets:
    dockAccessPassword: "<DOCK_ACCESS_PASSWORD>"  # 필수: Dock 로그인 비밀번호. ex) Demo-Dock-Only!42 (예시 전용). 업데이트 시에도 기존 값을 그대로 입력합니다.
